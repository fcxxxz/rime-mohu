schema:
  schema_id: mohu_flypy_fixed
  name: 字词·魔虎·小鹤
  version: "20260814"
  author:
    - 小鹤双拼方案：鹤氏
    - 方案制作：ksqsf
  description: |
    小鹤双拼配虎码首个最长主码前两码，采用 NAS 研究简码的码表式输入方式。
  dependencies:
    - mohu_flypy_fixed_legacy
    - mohu_charset
    - tiger

switches:
  - name: ascii_mode
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]
  - name: emoji
    states: [ 🈚, 🈶 ]
  - name: extended_charset
    states: [ 常用字, 全字集 ]
  - name: chaifen
    states: [ 不拆, 扌斥 ]
  - name: pinyinhint
    states: [ 🔇, 🔊 ]
  - name: unicode_comment
    states: [ U关, U开 ]
  - name: quick_code_hint
    states: [ 简码提示关, 简码提示 ]
  - name: aux_hint
    states: [ 辅助码提示关, 辅助码提示 ]
  - name: multi_short_code
    states: [ 多重简字, 唯一简字 ]
  - name: candidate_override_management
    states: [ 常规, 候选管理 ]
    reset: 0

engine:
  processors:
    - lua_processor@*mohu_skin_command
    - lua_processor@*mohu_candidate_manager*manager_processor
    - lua_processor@*mohu_candidate_override*override_processor
    - lua_processor@*mohu_pin*pin_processor
    - lua_processor@*option_sync
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - affix_segmentor@zkci
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@*mohu_symbol_hint
    - lua_translator@*mohu_candidate_manager*manager_translator
    - punct_translator
    - reverse_lookup_translator@reverse_tiger
    - reverse_lookup_translator@reverse_tiger_backtick
    - table_translator@custom_phrase       # 自定义短语
    - lua_translator@*mohu_contextual_translator*fixed_static_selector
    - lua_translator@*mohu_contextual_translator*fixed_selector
    - table_translator@zkci
    - history_translator@repeat
    - lua_translator@*mohu_shijian
    - lua_translator@*mohu_pin*panacea_translator
  filters:
    - lua_filter@*mohu_charset_filter
    - lua_filter@*mohu_pin*pin_filter
    - lua_filter@*mohu_candidate_override*override_order_filter
    - lua_filter@*mohu_candidate_override*override_filter
    - simplifier@emoji
    - simplifier@chaifen
    - simplifier@pinyinhint
    - lua_filter@*mohu_hint_filter
    - uniquifier

speller:
  # 允许进入编码串的字符集合；不在这里的按键由其他组件处理。
  alphabet: 'abcdefghijklmnopqrstuvwxyz/=;'
  # 音节分隔符；用于明确编码分段。
  delimiter: " '"
  max_code_length: 4
  # 是否允许拼写器自动选择候选；还受下面的匹配条件约束。
  auto_select: true
  # 只有编码匹配此正则时才允许自动选择，不是所有输入都自动上屏。
  auto_select_pattern: ^;(\w|;)+
  auto_clear: max_length # manual | auto | max_length
  # 编码变换规则，引用的补丁按顺序组合生成拼写索引。
  algebra:
    __patch:
      - mohu:/algebra/user_force_top?
      - mohu:/algebra/user_force_bottom?

translator:
  # 系统词典名，对应同名 dict.yaml；空字符串表示不加载系统词典。
  dictionary: mohu_flypy_fixed
  # 词典数据库类型：stabledb 用于稳定短语表，tabledb 用于码表用户词典。
  db_class: tabledb
  # 是否启用码表翻译器内置字符集过滤；与后续 Lua 字符集过滤器独立。
  enable_charset_filter: false
  # 是否按当前输入编码拼接词典字词自动造句；不是上屏后预测下一个词。
  enable_sentence: false
  # 是否输出未完成编码的补全候选；true 开启，false 关闭，仅作用于本翻译器。
  enable_completion: false
  # 是否使用用户词典学习与调频；false 不等于禁用系统词典。
  enable_user_dict: false
  # 候选初始质量分偏移；越大通常越靠前，最终顺序还受后续过滤器影响。
  initial_quality: 100000

fixed:
  # 系统词典名，对应同名 dict.yaml；空字符串表示不加载系统词典。
  dictionary: mohu_flypy_fixed
  # 用户词典名，用于保存学习记录；是否启用还受 enable_user_dict 控制。
  user_dict: mohu_flypy_fixed_tiger_prefix2
  # 词典数据库类型：stabledb 用于稳定短语表，tabledb 用于码表用户词典。
  db_class: tabledb
  # 是否启用码表翻译器内置字符集过滤；与后续 Lua 字符集过滤器独立。
  enable_charset_filter: false
  # 是否按当前输入编码拼接词典字词自动造句；不是上屏后预测下一个词。
  enable_sentence: false
  # 是否输出未完成编码的补全候选；true 开启，false 关闭，仅作用于本翻译器。
  enable_completion: false
  # 是否使用用户词典学习与调频；false 不等于禁用系统词典。
  enable_user_dict: true
  # 是否启用自动造词编码器；码表需要相应编码规则，不是补全开关。
  enable_encoder: true
  # 是否利用上屏历史自动造词；依赖 enable_encoder，编码器关闭时仅设 true 不会生效。
  encode_commit_history: false   # 是否开启自动造词
  # 候选初始质量分偏移；越大通常越靠前，最终顺序还受后续过滤器影响。
  initial_quality: 1000

