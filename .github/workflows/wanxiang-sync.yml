name: Wanxiang sync

'on':
  schedule:
    # 20:30 UTC = 次日 04:30 北京时间，低峰运行。
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: wanxiang-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # nightly 与 latest 内容对齐（用户要求：唯一差异是词库新旧）：在同步
  # workflow 内以同一套流程构建 Windows 运行时闭包，供打包 dist 时注入。
  windows-runtime:
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python environment
        run: uv sync --locked

      - name: Install MinGW toolchain and Python
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python

      - name: Build Lua 5.4.8 host and runtime
        shell: msys2 {0}
        env:
          LUA548_SHA256: 4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae
        run: |
          # Tiger Weasel embeds Lua 5.4.8. macOS Squirrel intentionally uses
          # its separate 5.4.6 dylib build; these runtimes cannot be mixed.
          curl -sL -o lua548.tar.gz https://www.lua.org/ftp/lua-5.4.8.tar.gz
          printf '%s  %s\n' "$LUA548_SHA256" lua548.tar.gz | sha256sum -c -
          tar xzf lua548.tar.gz
          cd lua-5.4.8/src
          core="lapi.c lcode.c lctype.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c"
          lib="lauxlib.c lbaselib.c lcorolib.c ldblib.c liolib.c lmathlib.c loadlib.c loslib.c lstrlib.c ltablib.c lutf8lib.c linit.c"
          gcc -O2 -shared -DLUA_BUILD_AS_DLL $core $lib -o lua54.dll
          gcc -O2 -DLUA_BUILD_AS_DLL lua.c -o lua.exe lua54.dll

      - name: Fetch onnxruntime for Windows
        shell: msys2 {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tigerengine.cc 内建魔虎语义进程内推理（semantic_infer.h），
          # 编译与运行都需要 onnxruntime。官方 win-x64 zip：lib/ 内含
          # onnxruntime.lib 与 onnxruntime.dll，include/ 含 C++ API 头。
          # 2026-09-17 起 runner 上 curl 直连 github release 下载（含本仓
          # 资产与官方源）稳定 404，objects CDN 链路异常；改用 gh CLI 走
          # api.github.com 拉取本仓 ort-deps Release 的同内容转存，官方
          # 源 curl 仅作后备，统一以官方 sha256 校验。
          ORT_ZIP=onnxruntime-win-x64-1.20.1.zip
          ORT_SHA256=78d447051e48bd2e1e778bba378bec4ece11191c9e538cf7b2c4a4565e8f5581
          # msys2 shell 不继承 Windows PATH，gh 用绝对路径兜底。
          # 官方直连优先；2026-09-17 05:00-06:30 UTC 期间 runner 到
          # objects CDN 的直链出现过临时 404（本地同时刻正常），因此保留
          # 本仓 ort-deps 镜像作后备，两者均以官方 sha256 校验。
          if curl --fail --location --retry 3 --retry-all-errors --output ort.zip \
            "https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/${ORT_ZIP}"; then
            echo "fetched from upstream"
          else
            # gh 运行需要 PATH 里有 git：注入 runner 预装的 Git for Windows。
            export PATH="/c/Program Files/Git/cmd:$PATH"
            GH_BIN="$(command -v gh || echo '/c/Program Files/GitHub CLI/gh.exe')"
            "$GH_BIN" release download ort-deps --pattern "${ORT_ZIP}" --output ort.zip --clobber
            test -s ort.zip
            echo "fetched from repo mirror via gh api"
          fi
          echo "${ORT_SHA256}  ort.zip" | sha256sum -c -
          python -m zipfile -e ort.zip .

      - name: Build and smoke-test the Windows engine
        shell: msys2 {0}
        env:
          ORT_HOME: ${{ github.workspace }}/onnxruntime-win-x64-1.20.1
          GH_TOKEN: ${{ github.token }}
        run: |
          g++ -O2 -std=c++17 -shared -static-libgcc -static-libstdc++ \
            -D_stdcall=__stdcall \
            -I tiger_sentence_native -I lua-5.4.8/src \
            -I "$ORT_HOME/include" -L "$ORT_HOME/lib" \
            tiger_sentence_native/tigerengine.cc tiger_sentence_native/tigerengine_lua.cc \
            lua-5.4.8/src/lua54.dll -lonnxruntime -o libtigerengine.dll
          objdump -p libtigerengine.dll | grep -q luaopen_tigerengine
          cp "$ORT_HOME/lib/onnxruntime.dll" ./
          # 模型资产自 603f65a 起以 zip 形式发布（裸 bin 直链已不存在）；
          # 与 ort 同理走 gh api 下载，解压后取裸 bin。
          # gh 运行需要 PATH 里有 git：注入 runner 预装的 Git for Windows。
          export PATH="/c/Program Files/Git/cmd:$PATH"
          GH_BIN="$(command -v gh || echo '/c/Program Files/GitHub CLI/gh.exe')"
          "$GH_BIN" release download latest \
            --pattern 'mohu-sentence-ngram-v5.bin.zip' \
            --output model.zip --clobber
          python -m zipfile -e model.zip .
          test -s mohu-sentence-ngram-v5.bin
          g++ -O2 -std=c++17 -D_stdcall=__stdcall \
            -I tiger_sentence_native -I "$ORT_HOME/include" \
            tiger_sentence_native/nativetest.cc tiger_sentence_native/tigerengine.cc \
            -L "$ORT_HOME/lib" -lonnxruntime -o nativetest.exe
          printf '1\tufqyhfmimh\n' > keys.txt
          ./nativetest.exe mohu-sentence-ngram-v5.bin \
            tiger_sentence_native/data/zrm/mohu_zrm.lexicon.txt keys.txt out.txt
          grep -q '迷茫' out.txt
          cp lua-5.4.8/src/lua54.dll ./
          cat > smoke.lua <<'LUA'
          local dll, model, lexicon = ...
          local engine = assert(package.loadlib(dll, "luaopen_tigerengine"))()
          local snapshot = "用户快照.bin"
          local expected = "new\0snapshot"
          assert(engine.atomic_write_snapshot_file(snapshot, "old"))
          assert(engine.atomic_write_snapshot_file(snapshot, expected))
          assert(engine.read_snapshot_file(snapshot) == expected)
          local missing, read_error = engine.read_snapshot_file("missing/snapshot.bin")
          assert(missing == nil and type(read_error) == "string")
          local wrote, write_error = engine.atomic_write_snapshot_file("missing/snapshot.bin", "x")
          assert(wrote == false and type(write_error) == "string")
          local handle = assert(engine.create(model, lexicon, 200, 1))
          local output = assert(engine.decode(handle, "ufqyhfmimh", false))
          assert(output:find("迷茫", 1, true), output)
          engine.free(handle)
          LUA
          ./lua-5.4.8/src/lua.exe smoke.lua "$PWD/libtigerengine.dll" \
            "$PWD/mohu-sentence-ngram-v5.bin" \
            "$PWD/tiger_sentence_native/data/zrm/mohu_zrm.lexicon.txt"

      - name: Probe primary model mapping on Windows
        shell: msys2 {0}
        env:
          TIGER_ENGINE_DLL: ${{ github.workspace }}/libtigerengine.dll
          TIGER_NGRAM: ${{ github.workspace }}/mohu-sentence-ngram-v5.bin
          TIGER_LEXICON: ${{ github.workspace }}/tiger_sentence_native/data/zrm/mohu_zrm.lexicon.txt
          ONNXRUNTIME_HOME: ${{ github.workspace }}/onnxruntime-win-x64-1.20.1
        run: |
          make tigerengine-snapshot-io tigerengine-mobile tigerengine-mapping
          cp "$ONNXRUNTIME_HOME/lib/onnxruntime.dll" .tmp/native-tests/
          make tigerengine-windows-memory \
            TIGER_MEMORY_OUTPUT=.tmp/native-tests/tigerengine-windows-mapping.json

      - name: Upload Windows mapping probe
        uses: actions/upload-artifact@v4
        with:
          name: tigerengine-windows-mapping
          path: .tmp/native-tests/tigerengine-windows-mapping.json
          if-no-files-found: error
          retention-days: 14

      - name: Collect Windows runtime closure
        shell: msys2 {0}
        run: >-
          python tools/collect_windows_runtime.py
          --entry libtigerengine.dll
          --search-dir .
          --search-dir lua-5.4.8/src
          --search-dir onnxruntime-win-x64-1.20.1/lib
          --search-dir /mingw64/bin
          --objdump objdump
          --output windows-runtime

      - name: Upload Windows runtime closure
        uses: actions/upload-artifact@v4
        with:
          name: mohu-windows-runtime-closure
          path: windows-runtime/
          if-no-files-found: error
          retention-days: 14

  sync:
    # 依赖本 workflow 内构建的 Windows 运行时闭包；串行启动避免 recovery
    # 快速路径上 download-artifact 早于闭包上传。
    needs: windows-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install OpenCC
        run: bash tools/install_opencc_ubuntu.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python environment
        run: uv sync --locked

      - name: Update Wanxiang snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run tools/sync_wanxiang.py update

      - name: Detect changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            changed=false
            echo "upstream unchanged"
          else
            changed=true
          fi
          current_revision="$(python3 -c 'import json; print(json.load(open("tools/data/wanxiang/manifest.json"))["revision"])')"
          current_main_sha="$(git rev-parse HEAD)"
          nightly_ready=false
          nightly_revision=""
          nightly_merge_sha=""
          if nightly_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" 2>/dev/null)"; then
            nightly_body="$(jq -r '.body // ""' <<< "$nightly_release")"
            nightly_draft="$(jq -r '.draft' <<< "$nightly_release")"
            nightly_prerelease="$(jq -r '.prerelease' <<< "$nightly_release")"
            nightly_revision="$(printf '%s\n' "$nightly_body" | sed -n 's/^<!-- upstream-revision: \([0-9a-f]\{40\}\) -->$/\1/p' | head -n 1)"
            nightly_merge_sha="$(printf '%s\n' "$nightly_body" | sed -n 's/^<!-- merge-sha: \([0-9a-f]\{40\}\) -->$/\1/p' | head -n 1)"
            nightly_complete="$(printf '%s\n' "$nightly_body" | sed -n 's/^<!-- publish-status: \(complete\) -->$/\1/p' | head -n 1)"
            nightly_zrm_sha="$(printf '%s\n' "$nightly_body" | sed -n 's/^<!-- zrm-sha256: \([0-9a-f]\{64\}\) -->$/\1/p' | head -n 1)"
            nightly_flypy_sha="$(printf '%s\n' "$nightly_body" | sed -n 's/^<!-- flypy-sha256: \([0-9a-f]\{64\}\) -->$/\1/p' | head -n 1)"
            nightly_mobile_zrm_sha="$(printf '%s\n' "$nightly_body" | sed -n 's/^<!-- mobile-zrm-sha256: \([0-9a-f]\{64\}\) -->$/\1/p' | head -n 1)"
            nightly_mobile_flypy_sha="$(printf '%s\n' "$nightly_body" | sed -n 's/^<!-- mobile-flypy-sha256: \([0-9a-f]\{64\}\) -->$/\1/p' | head -n 1)"
            nightly_release_id="$(jq -r '.id // empty' <<< "$nightly_release")"
            nightly_assets="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases/$nightly_release_id/assets?per_page=100" | jq 'add')"
            nightly_total_assets="$(jq 'length' <<< "$nightly_assets")"
            nightly_asset_count="$(jq '[.[] | select(.name == "rime-mohu-zrm-nightly.zip" or .name == "rime-mohu-flypy-nightly.zip" or .name == "rime-mohu-mobile-zrm-lite-nightly.zip" or .name == "rime-mohu-mobile-flypy-lite-nightly.zip")] | length' <<< "$nightly_assets")"
            nightly_zrm_digest="$(jq -r '[.[] | select(.name == "rime-mohu-zrm-nightly.zip")][0].digest // empty' <<< "$nightly_assets")"
            nightly_flypy_digest="$(jq -r '[.[] | select(.name == "rime-mohu-flypy-nightly.zip")][0].digest // empty' <<< "$nightly_assets")"
            nightly_mobile_zrm_digest="$(jq -r '[.[] | select(.name == "rime-mohu-mobile-zrm-lite-nightly.zip")][0].digest // empty' <<< "$nightly_assets")"
            nightly_mobile_flypy_digest="$(jq -r '[.[] | select(.name == "rime-mohu-mobile-flypy-lite-nightly.zip")][0].digest // empty' <<< "$nightly_assets")"
            nightly_zrm_state="$(jq -r '[.[] | select(.name == "rime-mohu-zrm-nightly.zip")][0].state // empty' <<< "$nightly_assets")"
            nightly_flypy_state="$(jq -r '[.[] | select(.name == "rime-mohu-flypy-nightly.zip")][0].state // empty' <<< "$nightly_assets")"
            nightly_mobile_zrm_state="$(jq -r '[.[] | select(.name == "rime-mohu-mobile-zrm-lite-nightly.zip")][0].state // empty' <<< "$nightly_assets")"
            nightly_mobile_flypy_state="$(jq -r '[.[] | select(.name == "rime-mohu-mobile-flypy-lite-nightly.zip")][0].state // empty' <<< "$nightly_assets")"
            nightly_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)"
            if [[ "$nightly_draft" == false \
              && "$nightly_prerelease" == true \
              && "$nightly_complete" == complete \
              && "$nightly_revision" == "$current_revision" \
              && "$nightly_merge_sha" == "$current_main_sha" \
              && "$nightly_tag_sha" == "$current_main_sha" \
              && "$nightly_asset_count" == 4 \
              && "$nightly_total_assets" == 4 \
              && "$nightly_zrm_state" == uploaded \
              && "$nightly_flypy_state" == uploaded \
              && "$nightly_mobile_zrm_state" == uploaded \
              && "$nightly_mobile_flypy_state" == uploaded \
              && "$nightly_zrm_digest" == "sha256:$nightly_zrm_sha" \
              && "$nightly_flypy_digest" == "sha256:$nightly_flypy_sha" \
              && "$nightly_mobile_zrm_digest" == "sha256:$nightly_mobile_zrm_sha" \
              && "$nightly_mobile_flypy_digest" == "sha256:$nightly_mobile_flypy_sha" ]]; then
              nightly_ready=true
            fi
          fi
          if [[ "$changed" == true || "$nightly_ready" != true ]]; then
            publish=true
          else
            publish=false
          fi
          printf 'changed=%s\npublish=%s\n' "$changed" "$publish" >> "$GITHUB_OUTPUT"
          printf 'current upstream revision: %s\n' "$current_revision"
          printf 'nightly upstream revision: %s\n' "${nightly_revision:-missing}"
          printf 'nightly ready: %s\n' "$nightly_ready"

      - name: Restore snapshots for nightly recovery
        if: steps.changes.outputs.publish == 'true' && steps.changes.outputs.changed != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run tools/sync_wanxiang.py restore

      - name: Guard daily delta
        if: steps.changes.outputs.changed == 'true'
        run: |
          python3 - <<'EOF'
          import re
          import sys
          from pathlib import Path

          report = Path("tools/data/wanxiang/sync_report.md").read_text(encoding="utf-8")
          limits = {"added": 100000, "removed": 50000}
          for name, limit in limits.items():
              match = re.search(rf"^- {name}: (\d+)$", report, re.MULTILINE)
              if match is None:
                  sys.exit(f"sync report is missing stat: {name}")
              value = int(match.group(1))
              print(f"{name}={value} (limit {limit})")
              if value > limit:
                  sys.exit(f"{name} {value} exceeds guard limit {limit}")
          EOF

      - name: Verify snapshots and determinism
        if: steps.changes.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run tools/sync_wanxiang.py check

      - name: Build, test, and validate distribution
        if: steps.changes.outputs.publish == 'true'
        run: |
          set -euo pipefail
          make quick
          uv run python -m unittest tests.test_wanxiang_sync tests.test_flypy_assets -v
          uv run --with ruff ruff check tools/sync_wanxiang.py
          git diff --check
          make dist-zrm dist-flypy

      - name: Guard generated diff
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(tools/data/wanxiang/manifest\.json|tools/data/wanxiang/SOURCE\.md|tools/data/wanxiang/sync_report\.md|mohu_zrm\.wanxiang\.dict\.yaml|mohu_flypy\.wanxiang\.dict\.yaml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'build changed an unexpected tracked file:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Open and merge sync pull request
        id: merge
        if: steps.changes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.changes.outputs.changed }}
        run: |
          set -euo pipefail
          if [[ "$CHANGED" != 'true' ]]; then
            git fetch --no-tags origin main
            main_sha="$(git rev-parse origin/main)"
            echo "merge_sha=$main_sha" >> "$GITHUB_OUTPUT"
            echo "nightly is missing or incomplete; publishing current main commit $main_sha"
            exit 0
          fi
          git fetch --no-tags origin main
          base_sha="$(git rev-parse origin/main)"
          local_sha="$(git rev-parse HEAD)"
          if [[ "$base_sha" != "$local_sha" ]]; then
            echo "main moved during synchronization; retry against $base_sha" >&2
            exit 1
          fi
          unexpected="$(git diff --name-only | grep -Ev '^(tools/data/wanxiang/manifest\.json|tools/data/wanxiang/SOURCE\.md|tools/data/wanxiang/sync_report\.md|mohu_zrm\.wanxiang\.dict\.yaml|mohu_flypy\.wanxiang\.dict\.yaml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'synchronizer changed an unexpected tracked file:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          revision_full="$(python3 -c 'import json; print(json.load(open("tools/data/wanxiang/manifest.json"))["revision"])')"
          revision="${revision_full:0:12}"
          branch="automation/wanxiang-sync"
          git checkout -b "$branch"
          git add tools/data/wanxiang/manifest.json \
            tools/data/wanxiang/SOURCE.md \
            tools/data/wanxiang/sync_report.md \
            mohu_zrm.wanxiang.dict.yaml \
            mohu_flypy.wanxiang.dict.yaml
          git diff --cached --check
          git commit -m "dict: sync wanxiang dictionaries ${revision}"
          head_sha="$(git rev-parse HEAD)"
          git push --force origin "$branch"
          body="$(cat tools/data/wanxiang/sync_report.md)

          上游: https://github.com/amzxyz/rime-wanxiang/commit/${revision_full}
          许可: CC BY 4.0，改动与署名说明见 tools/data/wanxiang/SOURCE.md。

          以上检查（快照哈希、确定性重建、make quick、单测、lint、dist）均在本 workflow 内通过后自动合并。"
          pr_number="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "dict: sync wanxiang dictionaries ${revision}" --body "$body"
          else
            gh pr create --base main --head "$branch" \
              --title "dict: sync wanxiang dictionaries ${revision}" --body "$body" >/dev/null
            pr_number="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          fi
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "could not resolve sync pull request number" >&2
            exit 1
          fi
          pr_state="$(gh pr view "$pr_number" --json baseRefName,headRefName,headRefOid,state \
            --jq '[.baseRefName, .headRefName, .headRefOid, .state] | @tsv')"
          IFS=$'\t' read -r base_ref head_ref remote_head state <<< "$pr_state"
          if [[ "$base_ref" != main || "$head_ref" != "$branch" || "$remote_head" != "$head_sha" || "$state" != OPEN ]]; then
            echo "sync pull request does not match expected base, head, or state" >&2
            printf 'base=%s head=%s remote_head=%s state=%s\n' "$base_ref" "$head_ref" "$remote_head" "$state" >&2
            exit 1
          fi
          allow_auto_merge="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.allow_auto_merge')"
          if [[ "$allow_auto_merge" == true ]]; then
            gh pr merge "$pr_number" --auto --squash --match-head-commit "$head_sha"
          else
            gh pr merge "$pr_number" --squash --match-head-commit "$head_sha"
          fi

          merge_sha=""
          merged=false
          merge_state=""
          auto_merge="disabled"
          for _ in {1..3600}; do
            pr_state="$(gh pr view "$pr_number" --json state,mergeCommit,mergeStateStatus,autoMergeRequest \
              --jq '[.state, (.mergeCommit.oid // ""), (.mergeStateStatus // ""), (if .autoMergeRequest then "enabled" else "disabled" end)] | @tsv' || true)"
            IFS=$'\t' read -r state merge_sha merge_state auto_merge <<< "$pr_state"
            if [[ "$state" == MERGED && "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
              merged=true
              break
            fi
            if [[ "$state" == CLOSED ]]; then
              break
            fi
            printf 'waiting for pull request merge: state=%s merge_state=%s auto_merge=%s\n' \
              "$state" "$merge_state" "$auto_merge"
            sleep 2
          done
          if [[ "$merged" != true ]]; then
            echo "pull request #${pr_number} was not merged" >&2
            printf 'state=%s merge_state=%s auto_merge=%s merge_sha=%s\n' \
              "$state" "$merge_state" "$auto_merge" "$merge_sha" >&2
            exit 1
          fi
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Download Windows runtime closure
        if: steps.changes.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mohu-windows-runtime-closure
          path: windows-runtime

      - name: Build nightly distributions from main
        if: steps.changes.outputs.publish == 'true'
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main_sha="$(git rev-parse origin/main)"
          if [[ "$current_main_sha" != "$MERGE_SHA" ]]; then
            echo "main moved after synchronization; refusing to publish stale commit" >&2
            printf 'expected=%s actual=%s\n' "$MERGE_SHA" "$current_main_sha" >&2
            exit 1
          fi
          git checkout --detach "$MERGE_SHA"
          uv run tools/sync_wanxiang.py check
          uv run python -m unittest tests.test_wanxiang_sync tests.test_flypy_assets -v
          uv run --with ruff ruff check tools/sync_wanxiang.py
          make quick
          git diff --check
          git diff --exit-code
          # 与 latest 同源同质：注入同一条流水线产出的 Windows 运行时闭包，
          # nightly 包内容与 release 包一致，差异只在词库新旧。
          make dist-zrm dist-flypy TIGER_WINDOWS_RUNTIME="$PWD/windows-runtime"
          make dist-mobile-zrm dist-mobile-flypy
          git diff --check
          git diff --exit-code
          test -f dist-zrm/mohu_zrm.schema.yaml
          test -f dist-flypy/mohu_flypy.schema.yaml
          test -f dist-zrm/mohu/config/README.md
          test -f dist-flypy/mohu/config/README.md
          chmod +x dist-zrm/Rime皮肤编辑器/启动.command
          chmod +x dist-flypy/Rime皮肤编辑器/启动.command
          (cd dist-zrm && zip -qr ../rime-mohu-zrm-nightly.zip .)
          (cd dist-flypy && zip -qr ../rime-mohu-flypy-nightly.zip .)
          mv rime-mohu-mobile-zrm-lite.zip rime-mohu-mobile-zrm-lite-nightly.zip
          mv rime-mohu-mobile-flypy-lite.zip rime-mohu-mobile-flypy-lite-nightly.zip
          for archive in rime-mohu-zrm-nightly.zip rime-mohu-flypy-nightly.zip \
            rime-mohu-mobile-zrm-lite-nightly.zip rime-mohu-mobile-flypy-lite-nightly.zip; do
            unzip -t "$archive" >/dev/null
            test -z "$(unzip -Z1 "$archive" | awk '/^\// || /(^|\/)\.\.($|\/)/ { print; exit }')"
          done
          for archive in rime-mohu-zrm-nightly.zip rime-mohu-flypy-nightly.zip; do
            unzip -Z1 "$archive" | grep -Fx "mohu/config/README.md" >/dev/null
            # 桌面包必须同时携带双平台运行时（与 latest 一致）。
            unzip -Z1 "$archive" | grep -Fx "mohu/runtime/libtigerengine.dll" >/dev/null
            unzip -Z1 "$archive" | grep -Fx "mohu/runtime/libtigerengine.dylib" >/dev/null
            unzip -Z1 "$archive" | grep -Fx "mohu/runtime/runtime-manifest.json" >/dev/null
          done
          for archive in rime-mohu-mobile-zrm-lite-nightly.zip rime-mohu-mobile-flypy-lite-nightly.zip; do
            unzip -Z1 "$archive" | grep -Fx "mohu/config/README.md" >/dev/null
            # 精简包红线：不携带模型与任何 native 二进制。
            test -z "$(unzip -Z1 "$archive" | grep -E '\.(bin|onnx|dylib|dll|so)$' || true)"
          done

      - name: Publish rolling nightly release
        if: steps.changes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          zrm_archive='rime-mohu-zrm-nightly.zip'
          flypy_archive='rime-mohu-flypy-nightly.zip'
          mobile_zrm_archive='rime-mohu-mobile-zrm-lite-nightly.zip'
          mobile_flypy_archive='rime-mohu-mobile-flypy-lite-nightly.zip'
          zrm_sha="$(sha256sum "$zrm_archive" | cut -d' ' -f1)"
          flypy_sha="$(sha256sum "$flypy_archive" | cut -d' ' -f1)"
          mobile_zrm_sha="$(sha256sum "$mobile_zrm_archive" | cut -d' ' -f1)"
          mobile_flypy_sha="$(sha256sum "$mobile_flypy_archive" | cut -d' ' -f1)"
          zrm_size="$(stat -c '%s' "$zrm_archive")"
          flypy_size="$(stat -c '%s' "$flypy_archive")"
          mobile_zrm_size="$(stat -c '%s' "$mobile_zrm_archive")"
          mobile_flypy_size="$(stat -c '%s' "$mobile_flypy_archive")"
          stage_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          stage_zrm="rime-mohu-zrm-nightly-staging-${stage_suffix}.zip"
          stage_flypy="rime-mohu-flypy-nightly-staging-${stage_suffix}.zip"
          stage_mobile_zrm="rime-mohu-mobile-zrm-lite-nightly-staging-${stage_suffix}.zip"
          stage_mobile_flypy="rime-mohu-mobile-flypy-lite-nightly-staging-${stage_suffix}.zip"
          stage_tag="nightly-staging-${stage_suffix}"
          cp "$zrm_archive" "$stage_zrm"
          cp "$flypy_archive" "$stage_flypy"
          cp "$mobile_zrm_archive" "$stage_mobile_zrm"
          cp "$mobile_flypy_archive" "$stage_mobile_flypy"

          revision="$(python3 -c 'import json; print(json.load(open("tools/data/wanxiang/manifest.json"))["revision"])')"
          revision_short="${revision:0:12}"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$MERGE_SHA"
          upstream_url="https://github.com/amzxyz/rime-wanxiang/commit/$revision"
          staging_notes="$RUNNER_TEMP/wanxiang-nightly-staging.md"
          notes_file="$RUNNER_TEMP/wanxiang-nightly-notes.md"
          printf '%s\n' '<!-- publish-status: staging -->' > "$staging_notes"
          {
            printf '%s\n' '<!-- publish-status: complete -->'
            printf '%s\n' "<!-- merge-sha: $MERGE_SHA -->"
            printf '%s\n' "<!-- upstream-revision: $revision -->"
            printf '%s\n' "<!-- zrm-sha256: $zrm_sha -->"
            printf '%s\n' "<!-- flypy-sha256: $flypy_sha -->"
            printf '%s\n' "<!-- mobile-zrm-sha256: $mobile_zrm_sha -->"
            printf '%s\n' "<!-- mobile-flypy-sha256: $mobile_flypy_sha -->"
            printf '%s\n\n' '## 魔虎万象 nightly'
            printf '%s\n' "- 主分支提交: [$MERGE_SHA]($commit_url)"
            printf '%s\n' "- 万象上游 revision: [$revision_short]($upstream_url)"
            printf '%s\n' "- 自然码 SHA-256: \`$zrm_sha\`"
            printf '%s\n' "- 小鹤 SHA-256: \`$flypy_sha\`"
            printf '%s\n' "- 手机精简版（自然码）SHA-256: \`$mobile_zrm_sha\`"
            printf '%s\n' "- 手机精简版（小鹤）SHA-256: \`$mobile_flypy_sha\`"
            printf '%s\n\n' '- 许可: CC BY 4.0；改编与署名说明见 `tools/data/wanxiang/SOURCE.md`。'
            cat tools/data/wanxiang/sync_report.md
            printf '%s\n\n' '本 Release 的桌面包与稳定版 `latest` 同源同质（含双平台运行时闭包），差异仅在词库为最新同步；另附手机精简版（无模型/无 native，模型自行导入）。'
            printf '%s\n' '下载：桌面 `rime-mohu-zrm-nightly.zip` / `rime-mohu-flypy-nightly.zip`；手机 `rime-mohu-mobile-zrm-lite-nightly.zip` / `rime-mohu-mobile-flypy-lite-nightly.zip`。'
          } > "$notes_file"

          releases="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq 'add')"
          release_id="$(jq -r '[.[] | select(.tag_name == "nightly")][0].id // empty' <<< "$releases")"
          stage_tag=""
          if [[ -z "$release_id" ]]; then
            release_id="$(jq -r '[.[] | select(.draft == true and (.tag_name | startswith("nightly-staging-")))][0].id // empty' <<< "$releases")"
          fi
          if [[ -n "$release_id" ]]; then
            release_tag="$(jq -r --argjson id "$release_id" '[.[] | select(.id == $id)][0].tag_name' <<< "$releases")"
            if [[ "$release_tag" == nightly ]]; then
              stage_tag='nightly'
            else
              stage_tag="$release_tag"
              if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$stage_tag" >/dev/null 2>&1; then
                gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f ref="refs/tags/$stage_tag" \
                  -f sha="$MERGE_SHA" >/dev/null
              else
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$stage_tag" \
                  -f sha="$MERGE_SHA" \
                  -F force=true >/dev/null
              fi
            fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f name='Wanxiang nightly' \
              -F draft=true \
              -F prerelease=true \
              --raw-field body="$(cat "$staging_notes")" >/dev/null
          else
            stage_tag="nightly-staging-${stage_suffix}"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$stage_tag" \
              -f sha="$MERGE_SHA" >/dev/null
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$stage_tag" \
              -f target_commitish="$MERGE_SHA" \
              -f name='Wanxiang nightly' \
              -F draft=true \
              -F prerelease=true \
              --raw-field body="$(cat "$staging_notes")" \
              --jq .id)"
          fi

          assets="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" | jq 'add')"
          while IFS= read -r asset_id; do
            [[ -z "$asset_id" ]] || gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < <(jq -r '.[] | select(.name | contains("-nightly-staging-")) | .id' <<< "$assets")

          zrm_asset="$(gh api --method POST \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$stage_zrm" \
            -H 'Content-Type: application/zip' --input "$stage_zrm")"
          flypy_asset="$(gh api --method POST \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$stage_flypy" \
            -H 'Content-Type: application/zip' --input "$stage_flypy")"
          mobile_zrm_asset="$(gh api --method POST \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$stage_mobile_zrm" \
            -H 'Content-Type: application/zip' --input "$stage_mobile_zrm")"
          mobile_flypy_asset="$(gh api --method POST \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$stage_mobile_flypy" \
            -H 'Content-Type: application/zip' --input "$stage_mobile_flypy")"
          zrm_stage_id="$(jq -r .id <<< "$zrm_asset")"
          flypy_stage_id="$(jq -r .id <<< "$flypy_asset")"
          mobile_zrm_stage_id="$(jq -r .id <<< "$mobile_zrm_asset")"
          mobile_flypy_stage_id="$(jq -r .id <<< "$mobile_flypy_asset")"
          if [[ "$zrm_stage_id" == null || "$flypy_stage_id" == null \
            || "$mobile_zrm_stage_id" == null || "$mobile_flypy_stage_id" == null \
            || "$(jq -r .state <<< "$zrm_asset")" != uploaded \
            || "$(jq -r '.digest // empty' <<< "$zrm_asset")" != "sha256:$zrm_sha" \
            || "$(jq -r .size <<< "$zrm_asset")" != "$zrm_size" \
            || "$(jq -r .state <<< "$flypy_asset")" != uploaded \
            || "$(jq -r '.digest // empty' <<< "$flypy_asset")" != "sha256:$flypy_sha" \
            || "$(jq -r .size <<< "$flypy_asset")" != "$flypy_size" \
            || "$(jq -r .state <<< "$mobile_zrm_asset")" != uploaded \
            || "$(jq -r '.digest // empty' <<< "$mobile_zrm_asset")" != "sha256:$mobile_zrm_sha" \
            || "$(jq -r .size <<< "$mobile_zrm_asset")" != "$mobile_zrm_size" \
            || "$(jq -r .state <<< "$mobile_flypy_asset")" != uploaded \
            || "$(jq -r '.digest // empty' <<< "$mobile_flypy_asset")" != "sha256:$mobile_flypy_sha" \
            || "$(jq -r .size <<< "$mobile_flypy_asset")" != "$mobile_flypy_size" ]]; then
            echo 'uploaded staging assets failed digest, size, or state validation' >&2
            exit 1
          fi

          assets="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" | jq 'add')"
          while IFS= read -r asset_id; do
            [[ -z "$asset_id" ]] || gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < <(jq -r --arg zrm "$zrm_stage_id" --arg flypy "$flypy_stage_id" \
            --arg mzrm "$mobile_zrm_stage_id" --arg mflypy "$mobile_flypy_stage_id" \
            '.[] | select((.id | tostring) != $zrm and (.id | tostring) != $flypy and (.id | tostring) != $mzrm and (.id | tostring) != $mflypy) | .id' <<< "$assets")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$zrm_stage_id" \
            -f name="$zrm_archive" >/dev/null
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$flypy_stage_id" \
            -f name="$flypy_archive" >/dev/null
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$mobile_zrm_stage_id" \
            -f name="$mobile_zrm_archive" >/dev/null
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$mobile_flypy_stage_id" \
            -f name="$mobile_flypy_archive" >/dev/null

          assets="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" | jq 'add')"
          if [[ "$(jq 'length' <<< "$assets")" != 4 \
            || "$(jq -r '[.[] | select(.name == "rime-mohu-zrm-nightly.zip")][0].state // empty' <<< "$assets")" != uploaded \
            || "$(jq -r '[.[] | select(.name == "rime-mohu-zrm-nightly.zip")][0].size // empty' <<< "$assets")" != "$zrm_size" \
            || "$(jq -r '[.[] | select(.name == "rime-mohu-zrm-nightly.zip")][0].digest // empty' <<< "$assets")" != "sha256:$zrm_sha" \
            || "$(jq -r '[.[] | select(.name == "rime-mohu-flypy-nightly.zip")][0].state // empty' <<< "$assets")" != uploaded \
            || "$(jq -r '[.[] | select(.name == "rime-mohu-flypy-nightly.zip")][0].size // empty' <<< "$assets")" != "$flypy_size" \
            || "$(jq -r '[.[] | select(.name == "rime-mohu-flypy-nightly.zip")][0].digest // empty' <<< "$assets")" != "sha256:$flypy_sha" \
            || "$(jq -r '[.[] | select(.name == "rime-mohu-mobile-zrm-lite-nightly.zip")][0].state // empty' <<< "$assets")" != uploaded \
            || "$(jq -r '[.[] | select(.name == "rime-mohu-mobile-zrm-lite-nightly.zip")][0].size // empty' <<< "$assets")" != "$mobile_zrm_size" \
            || "$(jq -r '[.[] | select(.name == "rime-mohu-mobile-zrm-lite-nightly.zip")][0].digest // empty' <<< "$assets")" != "sha256:$mobile_zrm_sha" \
            || "$(jq -r '[.[] | select(.name == "rime-mohu-mobile-flypy-lite-nightly.zip")][0].state // empty' <<< "$assets")" != uploaded \
            || "$(jq -r '[.[] | select(.name == "rime-mohu-mobile-flypy-lite-nightly.zip")][0].size // empty' <<< "$assets")" != "$mobile_flypy_size" \
            || "$(jq -r '[.[] | select(.name == "rime-mohu-mobile-flypy-lite-nightly.zip")][0].digest // empty' <<< "$assets")" != "sha256:$mobile_flypy_sha" ]]; then
            echo 'final nightly assets failed validation' >&2
            exit 1
          fi

          git fetch --no-tags origin main
          latest_main_sha="$(git rev-parse origin/main)"
          if [[ "$latest_main_sha" != "$MERGE_SHA" ]]; then
            echo "main moved during nightly publication; refusing to promote stale commit" >&2
            printf 'expected=%s actual=%s\n' "$MERGE_SHA" "$latest_main_sha" >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$MERGE_SHA" \
              -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/nightly' \
              -f sha="$MERGE_SHA" >/dev/null
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f tag_name='nightly' \
            -f name='Wanxiang nightly' \
            -F draft=false \
            -F prerelease=true \
            --raw-field body="$(cat "$notes_file")" >/dev/null

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly")"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha)"
          if [[ "$(jq -r .draft <<< "$release")" != false \
            || "$(jq -r .prerelease <<< "$release")" != true \
            || "$tag_sha" != "$MERGE_SHA" \
            || "$(jq -r '.assets | length' <<< "$release")" != 4 \
            || "$(jq -r '[.assets[] | select(.name == "rime-mohu-zrm-nightly.zip")][0].state // empty' <<< "$release")" != uploaded \
            || "$(jq -r '[.assets[] | select(.name == "rime-mohu-zrm-nightly.zip")][0].size // empty' <<< "$release")" != "$zrm_size" \
            || "$(jq -r '[.assets[] | select(.name == "rime-mohu-zrm-nightly.zip")][0].digest // empty' <<< "$release")" != "sha256:$zrm_sha" \
            || "$(jq -r '[.assets[] | select(.name == "rime-mohu-flypy-nightly.zip")][0].state // empty' <<< "$release")" != uploaded \
            || "$(jq -r '[.assets[] | select(.name == "rime-mohu-flypy-nightly.zip")][0].size // empty' <<< "$release")" != "$flypy_size" \
            || "$(jq -r '[.assets[] | select(.name == "rime-mohu-flypy-nightly.zip")][0].digest // empty' <<< "$release")" != "sha256:$flypy_sha" \
            || "$(jq -r '[.assets[] | select(.name == "rime-mohu-mobile-zrm-lite-nightly.zip")][0].state // empty' <<< "$release")" != uploaded \
            || "$(jq -r '[.assets[] | select(.name == "rime-mohu-mobile-zrm-lite-nightly.zip")][0].size // empty' <<< "$release")" != "$mobile_zrm_size" \
            || "$(jq -r '[.assets[] | select(.name == "rime-mohu-mobile-zrm-lite-nightly.zip")][0].digest // empty' <<< "$release")" != "sha256:$mobile_zrm_sha" \
            || "$(jq -r '[.assets[] | select(.name == "rime-mohu-mobile-flypy-lite-nightly.zip")][0].state // empty' <<< "$release")" != uploaded \
            || "$(jq -r '[.assets[] | select(.name == "rime-mohu-mobile-flypy-lite-nightly.zip")][0].size // empty' <<< "$release")" != "$mobile_flypy_size" \
            || "$(jq -r '[.assets[] | select(.name == "rime-mohu-mobile-flypy-lite-nightly.zip")][0].digest // empty' <<< "$release")" != "sha256:$mobile_flypy_sha" ]]; then
            echo 'published nightly release failed final validation' >&2
            exit 1
          fi

          # Promotion succeeded, so remove temporary draft releases and refs. A failed
          # run exits before this block and leaves its staging state for retry.
          if [[ "$stage_tag" != nightly ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$stage_tag" || true
          fi
          staging_releases="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq 'add | map(select(.draft == true and (.tag_name | startswith("nightly-staging-"))))')"
          while IFS=$'\t' read -r staging_id staging_tag; do
            [[ -z "$staging_id" ]] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$staging_id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$staging_tag" || true
          done < <(jq -r '.[] | [.id, .tag_name] | @tsv' <<< "$staging_releases")
          staging_refs="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/nightly-staging-" | jq 'add')"
          while IFS= read -r staging_ref; do
            [[ -z "$staging_ref" ]] || gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/${staging_ref#refs/}"
          done < <(jq -r '.[].ref' <<< "$staging_refs")
