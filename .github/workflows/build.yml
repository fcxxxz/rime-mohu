name: Build distribution

'on':
  pull_request:
  push:
    branches:
      - main
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenCC
        run: bash tools/install_opencc_ubuntu.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python environment
        run: uv sync --locked

      - name: Validate classical-text dictionaries
        run: |
          uv run tools/import_classics.py check
          uv run python -m unittest tests.test_classics_import -v

      - name: Build distributions
        run: make dist-zrm dist-flypy

      - name: Validate distributions
        run: |
          test -f dist-zrm/mohu_zrm.schema.yaml
          test -f dist-zrm/mohu_zrm.classics.dict.yaml
          test -f dist-zrm/lua/zrmdb.txt
          test -f dist-zrm/opencc/mohu_chaifen.ocd2
          test -f dist-zrm/opencc/mohu_emoji.ocd2
          test -f dist-flypy/mohu_flypy.schema.yaml
          test -f dist-flypy/mohu_flypy.classics.dict.yaml
          test -f dist-flypy/lua/zrmdb.txt
          test -f dist-flypy/opencc/mohu_chaifen.ocd2
          test -f dist-flypy/opencc/mohu_emoji.ocd2
          test ! -e dist-zrm/mohu_flypy.schema.yaml
          test ! -e dist-flypy/mohu_zrm.schema.yaml
          test ! -e dist-zrm/zh-hans-t-essay-bgc.gram
          test ! -e dist-flypy/zh-hans-t-essay-bgc.gram

      - name: Upload Natural Code distribution
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-zrm-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-zrm/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Flypy distribution
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-flypy-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-flypy/
          if-no-files-found: error
          retention-days: 14

  build-engine-win:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Windows installer with PowerShell 7
        shell: pwsh
        timeout-minutes: 15
        run: ./tests/test_mohu_llm_windows.ps1

      - name: Test Windows installer with Windows PowerShell 5.1
        shell: powershell
        timeout-minutes: 15
        run: ./tests/test_mohu_llm_windows.ps1

      - name: Build Lua 5.4.8 host and runtime
        shell: bash
        run: |
          # The shipped lua54.dll MUST match the Lua version embedded in the
          # target Weasel's rime.dll (Tiger weasel embeds 5.4.8).  A mismatched
          # minor version corrupts strings returned across the Lua C API:
          # libtigerengine.dll binds to this lua54.dll while the host state
          # belongs to rime.dll's embedded runtime.
          curl -sL -o lua548.tar.gz https://www.lua.org/ftp/lua-5.4.8.tar.gz
          tar xzf lua548.tar.gz
          cd lua-5.4.8/src
          core="lapi.c lcode.c lctype.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c"
          lib="lauxlib.c lbaselib.c lcorolib.c ldblib.c liolib.c lmathlib.c loadlib.c loslib.c lstrlib.c ltablib.c lutf8lib.c linit.c"
          gcc -O2 -shared -DLUA_BUILD_AS_DLL $core $lib -o lua54.dll
          gcc -O2 -DLUA_BUILD_AS_DLL lua.c -o lua.exe lua54.dll

      - name: Build tigerengine.dll
        shell: bash
        run: |
          g++ -O2 -std=c++17 -shared -static-libgcc -static-libstdc++ -static \
            -I tiger_sentence_native -I lua-5.4.8/src \
            tiger_sentence_native/tigerengine.cc tiger_sentence_native/tigerengine_lua.cc \
            lua-5.4.8/src/lua54.dll -o libtigerengine.dll
          objdump -p libtigerengine.dll | grep -q luaopen_tigerengine
          # Weasel loads the engine from the user directory, where the OS
          # loader never looks for mingw runtime DLLs: only KERNEL32.dll and
          # lua54.dll may remain as dynamic imports.
          objdump -p libtigerengine.dll | grep "DLL Name" | tee engine-deps.txt
          ! grep -Ei 'libwinpthread|libgcc|libstdc' engine-deps.txt

      - name: Smoke test engine with v5 model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NGRAM_SHA256: c2c148ea7aae3336b745f3f63551c6cf35cc6d0a892078e4bd4e7568a2dfee34
        run: |
          gh release download latest --repo "$GITHUB_REPOSITORY" \
            --pattern mohu-sentence-ngram-v5.bin --dir .
          printf '%s  %s\n' "$NGRAM_SHA256" mohu-sentence-ngram-v5.bin | sha256sum -c -
          g++ -O2 -std=c++17 -I tiger_sentence_native \
            tiger_sentence_native/nativetest.cc tiger_sentence_native/tigerengine.cc -o nativetest.exe
          printf '1\tufqyhfmimh\n' > keys.txt
          ./nativetest.exe mohu-sentence-ngram-v5.bin \
            tiger_sentence_native/data/zrm/mohu_llm_zrm.lexicon.txt keys.txt out.txt
          grep -q '迷茫' out.txt
          cp lua-5.4.8/src/lua54.dll ./lua54.dll
          cat > smoke.lua <<'LUA'
          local dll, model, lexicon = ...
          local engine = assert(package.loadlib(dll, "luaopen_tigerengine"))()
          local handle = engine.create(model, lexicon, 200, 1)
          assert(type(handle) == "number")
          local out = engine.decode(handle, "ufqyhfmimh", false)
          assert(type(out) == "string" and out:find("迷茫", 1, true), tostring(out))
          engine.free(handle)
          print("WINDOWS_LUA_SMOKE_OK")
          LUA
          ./lua-5.4.8/src/lua.exe smoke.lua "$PWD/libtigerengine.dll" \
            "$PWD/mohu-sentence-ngram-v5.bin" \
            "$PWD/tiger_sentence_native/data/zrm/mohu_llm_zrm.lexicon.txt"

      - name: Upload Windows engine
        uses: actions/upload-artifact@v4
        with:
          name: mohu-tigerengine-win64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            libtigerengine.dll
            lua54.dll
          if-no-files-found: error
          retention-days: 14

  build-llm:
    needs: build-engine-win
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python environment
        run: uv sync --locked

      - name: Install OpenCC
        run: brew install opencc

      - name: Download and verify custom n-gram
        env:
          # The custom Mohu v5 model ships as a release asset; CI downloads
          # and verifies it by SHA-256 so official packages carry the same
          # model as the locally validated build. gh + GITHUB_TOKEN keeps
          # working after the repository turns private.
          GH_TOKEN: ${{ github.token }}
          NGRAM_SHA256: c2c148ea7aae3336b745f3f63551c6cf35cc6d0a892078e4bd4e7568a2dfee34
        run: |
          gh release download latest --repo "$GITHUB_REPOSITORY" \
            --pattern mohu-sentence-ngram-v5.bin --dir .
          printf '%s  %s\n' "$NGRAM_SHA256" mohu-sentence-ngram-v5.bin | shasum -a 256 -c -

      - name: Download Windows engine artifact
        uses: actions/download-artifact@v4
        with:
          name: mohu-tigerengine-win64-${{ github.run_number }}-${{ github.run_attempt }}
          path: engine-win64

      - name: Build complete LLM scheme packages
        run: |
          uname -m
          dll="engine-win64/libtigerengine.dll"
          if [ ! -f "$dll" ]; then dll=""; fi
          make mohu-llm-zrm-dist mohu-llm-flypy-dist \
            MOHU_LLM_ZRM_DESTDIR=dist-mohu-llm-zrm \
            MOHU_LLM_FLYPY_DESTDIR=dist-mohu-llm-flypy \
            TIGER_NGRAM="$GITHUB_WORKSPACE/mohu-sentence-ngram-v5.bin" \
            TIGER_ENGINE_DLL="$dll"

      - name: Validate complete LLM packages
        env:
          NGRAM_SHA256: c2c148ea7aae3336b745f3f63551c6cf35cc6d0a892078e4bd4e7568a2dfee34
        run: |
          test -f dist-mohu-llm-zrm/mohu_llm_zrm.schema.yaml
          test -f dist-mohu-llm-flypy/mohu_llm_flypy.schema.yaml
          test -f dist-mohu-llm-zrm/base/default.yaml
          test -f dist-mohu-llm-flypy/base/default.yaml
          test -f dist-mohu-llm-zrm/base/mohu_zrm.schema.yaml
          test -f dist-mohu-llm-flypy/base/mohu_flypy.schema.yaml
          test -f dist-mohu-llm-zrm/base/mohu_zrm.extended.dict.yaml
          test -f dist-mohu-llm-flypy/base/mohu_flypy.extended.dict.yaml
          test -f dist-mohu-llm-zrm/base/opencc/mohu_emoji.json
          test -f dist-mohu-llm-flypy/base/opencc/mohu_emoji.json
          test -f dist-mohu-llm-zrm/base/lua/zrmdb.txt
          test -f dist-mohu-llm-flypy/base/lua/zrmdb.txt
          test -f dist-mohu-llm-zrm/base/opencc/mohu_chaifen.ocd2
          test -f dist-mohu-llm-flypy/base/opencc/mohu_chaifen.ocd2
          for name in mohu_TSCharacters mohu_chaifen mohu_dzing_variants mohu_emoji mohu_pinyinhint; do
            test -f "dist-mohu-llm-zrm/base/opencc/$name.ocd2"
            test -f "dist-mohu-llm-flypy/base/opencc/$name.ocd2"
          done
          test -f dist-mohu-llm-zrm/package.json
          test -f dist-mohu-llm-flypy/package.json
          test -f dist-mohu-llm-zrm/lua/mohu_llm_runtime.lua
          test -f dist-mohu-llm-flypy/lua/mohu_llm_runtime.lua
          test -f dist-mohu-llm-zrm/models/qwen35-0.8b.manifest
          test -f dist-mohu-llm-flypy/models/qwen3-0.6b.manifest
          test -x dist-mohu-llm-zrm/install_mohu_llm_zrm.command
          test -x dist-mohu-llm-flypy/install_mohu_llm_flypy.command
          test -f dist-mohu-llm-zrm/data/zrm/mohu_llm_zrm.lexicon.txt
          test -f dist-mohu-llm-flypy/data/flypy/mohu_llm_flypy.lexicon.txt
          test -f dist-mohu-llm-zrm/data/sentence-ngram-mobile.bin
          test -f dist-mohu-llm-flypy/data/sentence-ngram-mobile.bin
          for archive in dist-mohu-llm-zrm dist-mohu-llm-flypy; do
            printf '%s  %s\n' \
              "$NGRAM_SHA256" "$archive/data/sentence-ngram-mobile.bin" | shasum -a 256 -c -
          done
          test -f dist-mohu-llm-zrm/package.json
          test -f dist-mohu-llm-flypy/package.json
          test -f dist-mohu-llm-zrm/lua/mohu_llm_runtime.lua
          test -f dist-mohu-llm-flypy/lua/mohu_llm_runtime.lua
          test -f dist-mohu-llm-zrm/models/qwen35-0.8b.manifest
          test -f dist-mohu-llm-flypy/models/qwen3-0.6b.manifest
          codesign --verify --strict dist-mohu-llm-zrm/runtime/libtigerengine.dylib
          codesign --verify --strict dist-mohu-llm-flypy/runtime/libtigerengine.dylib
          test -f dist-mohu-llm-zrm/runtime/libtigerengine.dll
          test -f dist-mohu-llm-zrm/runtime/lua54.dll
          test -f dist-mohu-llm-flypy/runtime/libtigerengine.dll
          test -f dist-mohu-llm-flypy/runtime/lua54.dll
          test ! -e dist-mohu-llm-zrm/mohu_llm_flypy.schema.yaml
          test ! -e dist-mohu-llm-flypy/mohu_llm_zrm.schema.yaml
          test -z "$(find dist-mohu-llm-zrm/base -maxdepth 1 -name 'mohu_flypy*' -print)"
          test -z "$(find dist-mohu-llm-flypy/base -maxdepth 1 -name 'mohu_zrm*' -print)"
          test ! -e dist-mohu-llm-zrm/lua/four_code_yield_pairs_flypy.txt
          test ! -e dist-mohu-llm-zrm/base/lua/four_code_yield_pairs_flypy.txt
          test ! -e dist-mohu-llm-flypy/lua/four_code_yield_pairs_zrm.txt
          test ! -e dist-mohu-llm-flypy/base/lua/four_code_yield_pairs_zrm.txt
          test -z "$(find dist-mohu-llm-zrm dist-mohu-llm-flypy -type f \( -name '*.safetensors' -o -name '*.gguf' \) -print)"

      - name: Upload Natural-code LLM distribution
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-llm-zrm-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-mohu-llm-zrm/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Flypy LLM distribution
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-llm-flypy-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-mohu-llm-flypy/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, build-llm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-release
      queue: max
      cancel-in-progress: false
    steps:
      - name: Download Natural Code distribution
        uses: actions/download-artifact@v4
        with:
          name: rime-mohu-zrm-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-zrm

      - name: Download Flypy distribution
        uses: actions/download-artifact@v4
        with:
          name: rime-mohu-flypy-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-flypy

      - name: Download Natural-code LLM distribution
        uses: actions/download-artifact@v4
        with:
          name: rime-mohu-llm-zrm-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-mohu-llm-zrm

      - name: Download Flypy LLM distribution
        uses: actions/download-artifact@v4
        with:
          name: rime-mohu-llm-flypy-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-mohu-llm-flypy

      - name: Package distributions
        run: |
          # The artifact upload/download round-trip drops the exec bit, so
          # restore it before zipping; 启动.command must stay executable.
          chmod +x dist-zrm/Rime皮肤编辑器/启动.command
          chmod +x dist-flypy/Rime皮肤编辑器/启动.command
          chmod +x dist-mohu-llm-zrm/install_mohu_llm_*.command dist-mohu-llm-zrm/runtime/*.command
          chmod +x dist-mohu-llm-flypy/install_mohu_llm_*.command dist-mohu-llm-flypy/runtime/*.command
          (cd dist-zrm && zip -r ../rime-mohu-zrm-latest.zip .)
          (cd dist-flypy && zip -r ../rime-mohu-flypy-latest.zip .)
          (cd dist-mohu-llm-zrm && zip -r ../mohu-llm-zrm-latest.zip .)
          (cd dist-mohu-llm-flypy && zip -r ../mohu-llm-flypy-latest.zip .)
          for archive in mohu-llm-zrm-latest.zip mohu-llm-flypy-latest.zip; do
            test -z "$(unzip -Z1 "$archive" | awk '/^\// || /(^|\/)\.\.($|\/)/ { print; exit }')"
          done

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_exists=false
          release_body=''
          if release_body="$(gh release view latest --json body --jq .body 2>/dev/null)"; then
            release_exists=true
          fi
          released_run="$(
            printf '%s\n' "$release_body" |
              sed -n 's/^<!-- run-number: \([0-9][0-9]*\) -->$/\1/p' |
              head -n 1
          )"
          released_run="${released_run:-0}"
          if (( released_run > GITHUB_RUN_NUMBER )); then
            echo "Release already contains workflow run $released_run; skipping run $GITHUB_RUN_NUMBER."
            exit 0
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          printf '%s\n' \
            '<!-- run-number: '"$GITHUB_RUN_NUMBER"' -->' \
            '## 魔虎大模型方案' \
            '' \
            '### 下载与安装' \
            '' \
            '- 自然码：下载 `mohu-llm-zrm-latest.zip`，解压后双击 `install_mohu_llm_zrm.command`，然后在 Squirrel 菜单执行“重新部署”。' \
            '- 小鹤：下载 `mohu-llm-flypy-latest.zip`，解压后双击 `install_mohu_llm_flypy.command`，然后重新部署。' \
            '- Windows（小狼毫）：解压同一 zip，右键 `install_mohu_llm_windows.ps1` 选择“使用 PowerShell 运行”，然后在小狼毫中“重新部署”；Windows 版仅提供原生 v5 候选，不含 Qwen 重排。' \
            '- 每个 zip 已包含对应的标准魔虎方案、词库、Lua 与 OpenCC 资源，可直接安装到空的 Rime 用户目录；无需先安装标准包。' \
            '- 安装器只注册所选方案，升级安装时保留已有 `default.yaml`、用户词库和配置，可重复运行。' \
            '' \
            '### 模型' \
            '' \
            '包内 `data/sentence-ngram-mobile.bin` 为魔虎自定义候选模型 v5（SHA-256 `c2c148ea`），负责整句候选生成与排序。' \
            '' \
            '### Qwen 神经重排（可选）' \
            '' \
            'Qwen 权重不随包分发。按 `models/*.manifest` 下载到 `~/Library/Rime/mohu_llm/models/` 后，输入 `/model` 选择，或执行 `runtime/switch_qwen_model.command qwen3-0.6b`，然后重新部署。未安装 Qwen 时整句输入直接使用 v5。' \
            '' \
            '注：v5 训练语料含 LCCC（CC-BY-NC-SA）与 TNews/THUCNews（研究用途），仅限个人使用，请勿再分发。' \
            '' \
            '### 本次构建' \
            '' \
            '本次构建来自提交 ['"${GITHUB_SHA::7}"']('"$commit_url"').' > "$notes_file"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/latest' \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          if [[ "$release_exists" == true ]]; then
            gh release edit latest \
              --title 'Latest build' \
              --notes-file "$notes_file" \
              --latest
            gh release delete-asset latest rime-mohu-latest.zip --yes 2>/dev/null || true
            gh release delete-asset latest rime-mohu-llm-latest.zip --yes 2>/dev/null || true
            gh release delete-asset latest rime-mohu-llm-runtime-latest.zip --yes 2>/dev/null || true
            gh release upload latest \
              rime-mohu-zrm-latest.zip \
              rime-mohu-flypy-latest.zip \
              mohu-llm-zrm-latest.zip \
              mohu-llm-flypy-latest.zip \
              --clobber
          else
            gh release create latest \
              rime-mohu-zrm-latest.zip \
              rime-mohu-flypy-latest.zip \
              mohu-llm-zrm-latest.zip \
              mohu-llm-flypy-latest.zip \
              --verify-tag \
              --title 'Latest build' \
              --notes-file "$notes_file" \
              --latest
          fi
