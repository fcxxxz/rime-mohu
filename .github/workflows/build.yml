name: Build distribution

'on':
  pull_request:
  push:
    branches:
      - main
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenCC
        run: |
          sudo apt-get update
          sudo apt-get install --yes opencc

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python environment
        run: uv sync --locked

      - name: Build distribution
        run: make dist

      - name: Validate distribution
        run: |
          test -f dist/mohu_zrm.schema.yaml
          test -f dist/lua/zrmdb.txt
          test -f dist/opencc/mohu_chaifen.ocd2
          test -f dist/opencc/mohu_emoji.ocd2

      - name: Upload distribution
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
