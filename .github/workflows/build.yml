name: Build distribution

'on':
  pull_request:
  push:
    branches:
      - main
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenCC
        run: bash tools/install_opencc_ubuntu.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python environment
        run: uv sync --locked

      - name: Validate classical-text dictionaries
        run: |
          uv run tools/import_classics.py check
          uv run python -m unittest tests.test_classics_import -v

      - name: Build distributions
        run: make dist-zrm dist-flypy

      - name: Validate distributions
        run: |
          test -f dist-zrm/mohu_zrm.schema.yaml
          test -f dist-zrm/mohu_zrm.classics.dict.yaml
          test -f dist-zrm/lua/zrmdb.txt
          test -f dist-zrm/opencc/mohu_chaifen.ocd2
          test -f dist-zrm/opencc/mohu_emoji.ocd2
          test -f dist-flypy/mohu_flypy.schema.yaml
          test -f dist-flypy/mohu_flypy.classics.dict.yaml
          test -f dist-flypy/lua/zrmdb.txt
          test -f dist-flypy/opencc/mohu_chaifen.ocd2
          test -f dist-flypy/opencc/mohu_emoji.ocd2
          test ! -e dist-zrm/mohu_flypy.schema.yaml
          test ! -e dist-flypy/mohu_zrm.schema.yaml
          test ! -e dist-zrm/zh-hans-t-essay-bgc.gram
          test ! -e dist-flypy/zh-hans-t-essay-bgc.gram

      - name: Upload Natural Code distribution
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-zrm-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-zrm/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Flypy distribution
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-flypy-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-flypy/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-release
      queue: max
      cancel-in-progress: false
    steps:
      - name: Download Natural Code distribution
        uses: actions/download-artifact@v4
        with:
          name: rime-mohu-zrm-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-zrm

      - name: Download Flypy distribution
        uses: actions/download-artifact@v4
        with:
          name: rime-mohu-flypy-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-flypy

      - name: Package distributions
        run: |
          # The artifact upload/download round-trip drops the exec bit, so
          # restore it before zipping; 启动.command must stay executable.
          chmod +x dist-zrm/Rime皮肤编辑器/启动.command
          chmod +x dist-flypy/Rime皮肤编辑器/启动.command
          (cd dist-zrm && zip -r ../rime-mohu-zrm-latest.zip .)
          (cd dist-flypy && zip -r ../rime-mohu-flypy-latest.zip .)

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_exists=false
          release_body=''
          if release_body="$(gh release view latest --json body --jq .body 2>/dev/null)"; then
            release_exists=true
          fi
          released_run="$(
            printf '%s\n' "$release_body" |
              sed -n 's/^<!-- run-number: \([0-9][0-9]*\) -->$/\1/p' |
              head -n 1
          )"
          released_run="${released_run:-0}"
          if (( released_run > GITHUB_RUN_NUMBER )); then
            echo "Release already contains workflow run $released_run; skipping run $GITHUB_RUN_NUMBER."
            exit 0
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          printf '<!-- run-number: %s -->\nAutomated build from commit [%s](%s).\n' \
            "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" "$commit_url" > "$notes_file"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/latest' \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          if [[ "$release_exists" == true ]]; then
            gh release edit latest \
              --title 'Latest build' \
              --notes-file "$notes_file" \
              --latest
            gh release delete-asset latest rime-mohu-latest.zip --yes 2>/dev/null || true
            gh release upload latest \
              rime-mohu-zrm-latest.zip \
              rime-mohu-flypy-latest.zip \
              --clobber
          else
            gh release create latest \
              rime-mohu-zrm-latest.zip \
              rime-mohu-flypy-latest.zip \
              --verify-tag \
              --title 'Latest build' \
              --notes-file "$notes_file" \
              --latest
          fi
