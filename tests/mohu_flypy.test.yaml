      - send: lu
        assert: cand[1].text == '路' and cand[2].text == '老师' and cand[2].comment == '⚡️'
      - send: cw
        assert: cand[1].text == '错误' and cand[1].comment == '⚡️' and has_text(cand, '𤭢')
      - send: ix
        assert: cand[1].text == '出现' and cand[1].comment == '⚡️' and has_text(cand, '欻')
      - send: rx
        assert: cand[1].text == '如下' and cand[1].comment == '⚡️' and has_text(cand, '挼')
      - send: df
        assert: cand[1].text == '地方' and cand[1].comment == '⚡️' and has_text(cand, '扽')
      - send: bl
        assert: cand[1].text == '本来' and cand[1].comment == '⚡️' and has_text(cand, '𰻝')
      - send: cwz
        assert: cand[1].text == '𤭢' and cand[1].comment == '⚡️'
