schema: tiger
source_dir: ../dist
script: |
  function has_text(candidates, text)
    for _, candidate in ipairs(candidates) do
      if candidate.text == text then return true end
    end
    return false
  end

deploy:
  default:
    tests:
      - send: fi
        assert: has_text(cand, '一')
      - send: '`huo'
        assert: has_text(cand, '火')

