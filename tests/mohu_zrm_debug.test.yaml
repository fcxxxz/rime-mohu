## 简体测试

schema: mohu_zrm
source_dir: ../dist
script: |
  function eq(left, right)
    print('Left  = ' .. tostring(left))
    print('Right = ' .. tostring(right))
    return left == right
  end

  function no_commit(value)
    return value == nil or value == ''
  end

  function dump_candidates(candidates)
    for index, candidate in ipairs(candidates) do
      print(index .. ': ' .. candidate.text .. ' type=' .. tostring(candidate.type) .. ' comment=' .. tostring(candidate.comment) .. ' preedit=' .. tostring(candidate.preedit))
    end
    return false
  end

  function has_text(candidates, text)
    for _, candidate in ipairs(candidates) do
      if candidate.text == text then return true end
    end
    return false
  end

  function has_text_in_first(candidates, text, limit)
    for index, candidate in ipairs(candidates) do
      if index > limit then return false end
      if candidate.text == text then return true end
    end
    return false
  end

  function text_index(candidates, text)
    for index, candidate in ipairs(candidates) do
      if candidate.text == text then return index end
    end
    return nil
  end

  function has_comment(candidates, pattern)
    for _, candidate in ipairs(candidates) do
      if candidate.comment:find(pattern) then return true end
    end
    return false
  end

deploy:
