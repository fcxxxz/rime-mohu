name: Build distribution

'on':
  pull_request:
  push:
    branches:
      - main
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenCC
        run: |
          sudo apt-get update
          sudo apt-get install --yes opencc

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python environment
        run: uv sync --locked

      - name: Build distribution
        run: make dist

      - name: Validate distribution
        run: |
          test -f dist/mohu_zrm.schema.yaml
          test -f dist/lua/zrmdb.txt
          test -f dist/opencc/mohu_chaifen.ocd2
          test -f dist/opencc/mohu_emoji.ocd2

      - name: Upload distribution
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-release
      queue: max
      cancel-in-progress: false
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: rime-mohu-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist

      - name: Package distribution
        run: |
          cd dist
          zip -r ../rime-mohu-latest.zip .

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_exists=false
          release_body=''
          if release_body="$(gh release view latest --json body --jq .body 2>/dev/null)"; then
            release_exists=true
          fi
          released_run="$(
            printf '%s\n' "$release_body" |
              sed -n 's/^<!-- run-number: \([0-9][0-9]*\) -->$/\1/p' |
              head -n 1
          )"
          released_run="${released_run:-0}"
          if (( released_run > GITHUB_RUN_NUMBER )); then
            echo "Release already contains workflow run $released_run; skipping run $GITHUB_RUN_NUMBER."
            exit 0
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          printf '<!-- run-number: %s -->\nAutomated build from commit [%s](%s).\n' \
            "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" "$commit_url" > "$notes_file"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/latest' \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          if [[ "$release_exists" == true ]]; then
            gh release edit latest \
              --title 'Latest build' \
              --notes-file "$notes_file" \
              --latest
            gh release upload latest rime-mohu-latest.zip --clobber
          else
            gh release create latest rime-mohu-latest.zip \
              --verify-tag \
              --title 'Latest build' \
              --notes-file "$notes_file" \
              --latest
          fi
