# ============================================
# Rime 同步助手 配置文件
# ============================================
# 直接编辑这个文件并保存即可，下次检查自动生效，无需重启。
# 开关可以写：开 / 关（也接受 on/off、true/false）
# 分钟数范围都是 1 - 1440

# 空闲同步：电脑无操作一段时间后自动同步一次，恢复操作后重新计时
# 实际触发时间最多比设定晚一个检查间隔
空闲同步: 开

# 空闲多少分钟后触发
空闲分钟数: 10

# 开机同步：登录系统后立即同步一次
开机同步: 开

# 检查间隔：每隔多少分钟被系统拉起检查一次（默认 5）
# 注意：修改这一项后需要重新双击「安装.command」才会生效，其他项保存即生效
检查间隔分钟数: 30
