name: 转码表

# 零门槛自定义方案：用户把「双拼+辅码」单字码表上传到自己 fork 的仓库
# （根目录或 my-schema/ 目录），在 Actions 页面手动触发本 workflow，
# 网页上填文件名/方案名即可得到完整方案包。面向不会命令行的小白，
# 步骤说明见 README「零门槛：用自己的码表生成专属方案」一节。

on:
  workflow_dispatch:
    inputs:
      table_file:
        description: "码表文件名：你在第 2 步上传的文件（含扩展名，如 我的码表.txt）"
        required: true
        default: ""
      scheme_name:
        description: "方案名：小写英文字母开头（如 mycode），装进 Rime 后的方案 ID"
        required: true
        default: "mycode"
      display_name:
        description: "显示名：输入法选单里显示的名字，可用中文（如 我的码）；留空则用方案名"
        required: false
        default: ""
      layout:
        description: "双拼布局：留空=自动识别；识别不对时填 zrm（自然码）/ flypy（小鹤）/ jiajia（加加）"
        required: false
        default: ""
      unique_shortcode:
        description: "简码无重：开启后一/二/三简每个码位只留一个字，撞位字往后推（改用全码打）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TABLE_FILE: ${{ inputs.table_file }}
      SCHEME_NAME: ${{ inputs.scheme_name }}
      DISPLAY_NAME: ${{ inputs.display_name }}
      LAYOUT: ${{ inputs.layout }}
      UNIQUE_SHORTCODE: ${{ inputs.unique_shortcode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python environment
        run: uv sync --locked

      - name: 找到码表文件
        run: |
          if [ -z "$TABLE_FILE" ]; then
            echo "::error::第 1 个框（码表文件名）没有填。回到 Run workflow，填上你上传的文件名（含扩展名）。"
            exit 1
          fi
          if [ -f "$TABLE_FILE" ]; then
            echo "TABLE_PATH=$TABLE_FILE" >> "$GITHUB_ENV"
            echo "码表：$TABLE_FILE"
          elif [ -f "my-schema/$TABLE_FILE" ]; then
            echo "TABLE_PATH=my-schema/$TABLE_FILE" >> "$GITHUB_ENV"
            echo "码表：my-schema/$TABLE_FILE"
          else
            echo "::error::仓库里找不到「$TABLE_FILE」。请先按 README 第 2 步把码表上传到仓库根目录（或 my-schema/ 文件夹）并 Commit，再重新运行。"
            exit 1
          fi

      - name: 构建方案包
        run: |
          ARGS=(--char-table "$TABLE_PATH" --name "$SCHEME_NAME" --zip)
          if [ -n "$DISPLAY_NAME" ]; then
            ARGS+=(--display "$DISPLAY_NAME")
          fi
          if [ -n "$LAYOUT" ]; then
            ARGS+=(--sp "$LAYOUT")
          fi
          if [ "$UNIQUE_SHORTCODE" = "true" ]; then
            ARGS+=(--unique-shortcode)
          fi
          uv run tools/custom/build_custom_scheme.py "${ARGS[@]}"

      - name: 上传方案包
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-${{ env.SCHEME_NAME }}
          path: |
            custom-dist/rime-mohu-${{ env.SCHEME_NAME }}.zip
            custom-dist/mohu_${{ env.SCHEME_NAME }}/构建报告.txt
            custom-dist/mohu_${{ env.SCHEME_NAME }}/推导辅码表.tsv
            custom-dist/mohu_${{ env.SCHEME_NAME }}/安装说明.md
          if-no-files-found: error
          retention-days: 30

      - name: 完成指引
        run: |
          {
            echo "## ✅ 你的方案包已经生成"
            echo
            echo "1. 把本页拉到底部，在 **Artifacts** 区域下载 **rime-mohu-${SCHEME_NAME}**；"
            echo "2. 解压下载的 zip（Windows 建议用 Bandizip / 7-Zip，系统自带解压对中文文件名可能乱码）；"
            echo "3. 按解压出来的《安装说明.md》安装；整句模型只需装一次，见仓库 [Releases](https://github.com/${{ github.repository }}/releases) 的 mohu-sentence-ngram-v5.bin（已装过魔虎可跳过）。"
            echo
            echo "构建统计与逐字辅码明细见同目录的《构建报告.txt》和《推导辅码表.tsv》。"
          } >> "$GITHUB_STEP_SUMMARY"
