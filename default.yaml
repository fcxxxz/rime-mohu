# Rime default settings
# encoding: utf-8

config_version: '1.0.mohu'

schema_list:
  - schema: mohu_zrm
  - schema: mohu_flypy
  - schema: mohu_flypy_fixed
  - schema: mohu_flypy_sentence
  - schema: mohu_flypy_aux
  - schema: tiger
  # - schema: luna_pinyin
  # - schema: luna_pinyin_simp
  # - schema: luna_pinyin_fluency
  # - schema: bopomofo
  # - schema: bopomofo_tw
  # - schema: cangjie5
  # - schema: stroke
  # - schema: terra_pinyin

switcher:
  caption: 〔方案选单〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
    - extended_charset
    - emoji
    - inflexible
    - unicode_comment
    - contextual_order
    - quick_code_hint
    - aux_hint
    - multi_short_code
    - mohu_tiger_sentence_neural_rerank
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 5

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/numbered_mode_switch
      # - key_bindings:/paging_with_comma_period

recognizer:
  patterns:
    email: "^([A-Za-z][-_.0-9A-Za-z]*|)@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
