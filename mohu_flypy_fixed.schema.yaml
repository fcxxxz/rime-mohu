  # 系统词典名，对应同名 dict.yaml；空字符串表示不加载系统词典。
  dictionary: mohu_flypy_fixed_legacy
  # 用户词典名，用于保存学习记录；是否启用还受 enable_user_dict 控制。
  user_dict: mohu_flypy_fixed_tiger_prefix2
  # 词典数据库类型：stabledb 用于稳定短语表，tabledb 用于码表用户词典。
  db_class: tabledb
  # 是否启用码表翻译器内置字符集过滤；与后续 Lua 字符集过滤器独立。
  enable_charset_filter: false
  # 是否按当前输入编码拼接词典字词自动造句；不是上屏后预测下一个词。
  enable_sentence: false
  # 是否输出未完成编码的补全候选；true 开启，false 关闭，仅作用于本翻译器。
  enable_completion: false
  # 是否使用用户词典学习与调频；false 不等于禁用系统词典。
  enable_user_dict: true
  # 是否启用自动造词编码器；码表需要相应编码规则，不是补全开关。
  enable_encoder: true
  # 是否利用上屏历史自动造词；依赖 enable_encoder，编码器关闭时仅设 true 不会生效。
  encode_commit_history: false
  # 候选初始质量分偏移；越大通常越靠前，最终顺序还受后续过滤器影响。
  initial_quality: 1000

translator_legacy:
  # 系统词典名，对应同名 dict.yaml；空字符串表示不加载系统词典。
  dictionary: mohu_flypy_fixed_legacy
  # 词典数据库类型：stabledb 用于稳定短语表，tabledb 用于码表用户词典。
  db_class: tabledb
  # 是否启用码表翻译器内置字符集过滤；与后续 Lua 字符集过滤器独立。
  enable_charset_filter: false
  # 是否按当前输入编码拼接词典字词自动造句；不是上屏后预测下一个词。
  enable_sentence: false
  # 是否输出未完成编码的补全候选；true 开启，false 关闭，仅作用于本翻译器。
  enable_completion: false
  # 是否使用用户词典学习与调频；false 不等于禁用系统词典。
  enable_user_dict: false
  # 候选初始质量分偏移；越大通常越靠前，最终顺序还受后续过滤器影响。
  initial_quality: 100000

custom_phrase: # 自定义短语
  # 系统词典名，对应同名 dict.yaml；空字符串表示不加载系统词典。
  dictionary: ""
  # 用户词典名，用于保存学习记录；是否启用还受 enable_user_dict 控制。
  user_dict: mohu_flypy_custom_phrases
  # 词典数据库类型：stabledb 用于稳定短语表，tabledb 用于码表用户词典。
  db_class: stabledb
  # 是否输出未完成编码的补全候选；true 开启，false 关闭，仅作用于本翻译器。
  enable_completion: false
  # 是否按当前输入编码拼接词典字词自动造句；不是上屏后预测下一个词。
  enable_sentence: false
  # 候选初始质量分偏移；越大通常越靠前，最终顺序还受后续过滤器影响。
  initial_quality: 500000

zkci:           # 造词
  # 本翻译器响应的输入分段标签；需与分段器识别出的标签对应。
  tag: zkci
  # 词典数据库类型：stabledb 用于稳定短语表，tabledb 用于码表用户词典。
  db_class: tabledb
  # 系统词典名，对应同名 dict.yaml；空字符串表示不加载系统词典。
  dictionary: mohu_flypy_fixed
  # 是否使用用户词典学习与调频；false 不等于禁用系统词典。
  enable_user_dict: false
  # 是否启用码表翻译器内置字符集过滤；与后续 Lua 字符集过滤器独立。
  enable_charset_filter: false
  # 是否输出未完成编码的补全候选；true 开启，false 关闭，仅作用于本翻译器。
  enable_completion: false
  # 是否按当前输入编码拼接词典字词自动造句；不是上屏后预测下一个词。
  enable_sentence: true
  # 是否启用自动造词编码器；码表需要相应编码规则，不是补全开关。
  enable_encoder: false
  # 码表自动造词的最大词长，不是编码长度或候选页大小。
  max_phrase_length: 4
  # 进入此反查或造词功能的引导字符；不是补全候选的匹配前缀。
  prefix: "'"
  # 进入此功能时显示的提示文字。
  tips: 〔造词〕
  # 候选初始质量分偏移；越大通常越靠前，最终顺序还受后续过滤器影响。
  initial_quality: 10

repeat:        # 重复上屏
  input: "="
  size: 1
  initial_quality: 0

chaifen:
  option_name: chaifen
  opencc_config: mohu_chaifen.json
  tips: char
  show_in_comment: true
  comment_format:
    - "xform/-/ /"
    - "xform/〕〔/｜/"

recognizer:
  import_preset: default
  patterns:
    reverse_tiger: "^ohm[a-z]+$"
    reverse_tiger_backtick: "^`[a-z]+$"
    candidate_manager: "^==[hopwlu]?[a-z]*$"

    zkci: "^[a-z]*'[a-z']*$"
    panacea: "^[a-z]*/{1,2}[a-z']*$"
    punct: '^/([0-9]0?|[A-Za-z]*)$'


reverse_tiger:
  # 本翻译器响应的输入分段标签；需与分段器识别出的标签对应。
  tag: reverse_tiger
  # 系统词典名，对应同名 dict.yaml；空字符串表示不加载系统词典。
  dictionary: tiger
  # 是否输出未完成编码的补全候选；true 开启，false 关闭，仅作用于本翻译器。
  enable_completion: true
  # 进入此反查或造词功能的引导字符；不是补全候选的匹配前缀。
  prefix: "ohm"
  # 进入此功能时显示的提示文字。
  tips: 〔虎〕
  comment_format:
    - xform/(\w\w);(\w\w)/$1[$2]/

reverse_tiger_backtick:
  # 本翻译器响应的输入分段标签；需与分段器识别出的标签对应。
  tag: reverse_tiger_backtick
  # 系统词典名，对应同名 dict.yaml；空字符串表示不加载系统词典。
  dictionary: tiger
  # 是否输出未完成编码的补全候选；true 开启，false 关闭，仅作用于本翻译器。
  enable_completion: true
  # 进入此反查或造词功能的引导字符；不是补全候选的匹配前缀。
  prefix: "`"
  # 进入此功能时显示的提示文字。
  tips: 〔虎〕
  comment_format:
    - xform/(\w\w);(\w\w)/$1[$2]/

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default
  custom_bindings:
    __append:
      # 在这里添加只在本方案中生效的按键绑定
      # 取消下行注释，按住 = 不放可以连续上屏
      # - { when: has_menu, accept: '=', send: 4 }  # 4 对应于 history_translator 的输出位置，修改 symbols.yaml 后需要作相应修改
  bindings:
    __patch:
      - :/key_binder/custom_bindings?
      - mohu:/key_bindings/mohu_switches
      - mohu:/key_bindings/mohu_semicolon_for_2
      - mohu:/key_bindings/mohu_keypad

# 默认不开启语言模型（八股文模型已移除）

mohu:
  charset: simp
  candidate_manager:
    __include: mohu:/candidate_manager
    memory_namespace: fixed

  # 内置候选调序、软删除与恢复。
  candidate_override:
    __include: mohu:/candidate_override

  # 简快码提示滤镜，由方案菜单中的「简码提示」开关控制
  # 例如，在输入 jqrf 时，「机器人」候选会增加「⚡jqr」提示，表示该词有简码打法。
  quick_code_hint_skip_chars: true  # 是否跳过单字, 字词模式中建议不提示单字避免干扰
  inject_fixed_words: true          # 三字以上词允许提示四码简码

  pin:
    __include: mohu:/pin
