name: 转码表（Issue）

# 用户在 Issues 页用「🔄 转码表」表单提交（拖码表附件 + 填方案名），
# 本 workflow 解析表单、构建派生方案包，并把 Artifacts 下载链接评论
# 回 Issue。用户无需 fork、无需上传文件到仓库；编辑 Issue 会自动重跑。

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: custom-schema-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build:
    if: contains(github.event.issue.labels.*.name, '转码表')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python environment
        run: uv sync --locked

      - name: 解析 Issue 表单
        id: form
        run: |
          mkdir -p issue-work
          printf '%s' "$ISSUE_BODY" > issue-work/body.txt
          if uv run tools/custom/issue_form.py issue-work/body.txt issue-work 2> issue-work/parse.log | tee issue-work/form.env; then
            cat issue-work/form.env >> "$GITHUB_ENV"
            grep -E '^(SCHEME_NAME|LAYOUT)=' issue-work/form.env >> "$GITHUB_OUTPUT"
            echo "表单解析完成。"
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat issue-work/parse.log)"
            exit 1
          fi

      - name: 构建方案包
        run: |
          ARGS=(--char-table "$TABLE_PATH" --name "$SCHEME_NAME" --zip)
          if [ -n "$DISPLAY_NAME" ]; then
            ARGS+=(--display "$DISPLAY_NAME")
          fi
          if [ -n "$LAYOUT" ]; then
            ARGS+=(--sp "$LAYOUT")
          fi
          if [ -n "$WORD_TABLE_PATH" ]; then
            ARGS+=(--word-table "$WORD_TABLE_PATH")
          fi
          if [ "$KEEP_SHORTCODES" = "true" ]; then
            ARGS+=(--keep-shortcodes)
          fi
          set -o pipefail
          uv run tools/custom/build_custom_scheme.py "${ARGS[@]}" 2>&1 | tee issue-work/build.log

      - name: 上传方案包
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-${{ steps.form.outputs.SCHEME_NAME }}-issue${{ env.ISSUE_NUMBER }}
          path: |
            custom-dist/rime-mohu-${{ steps.form.outputs.SCHEME_NAME }}.zip
            custom-dist/mohu_${{ steps.form.outputs.SCHEME_NAME }}/构建报告.txt
            custom-dist/mohu_${{ steps.form.outputs.SCHEME_NAME }}/推导辅码表.tsv
            custom-dist/mohu_${{ steps.form.outputs.SCHEME_NAME }}/安装说明.md
          if-no-files-found: error
          retention-days: 7

      - name: 回复下载链接并关闭 Issue
        run: |
          REPLY="## ✅ 方案包已生成：魔虎·${DISPLAY_NAME:-$SCHEME_NAME}

          1. 在浏览器打开
          [本次构建的运行页面](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID})，
          拉到页面底部 **Artifacts** 区域，下载 **rime-mohu-${SCHEME_NAME}-issue${ISSUE_NUMBER}**（需登录 GitHub）；
          2. 解压下载的 zip——Windows 建议用 [Bandizip](https://www.bandisoft.com/bandizip/)
             或 7-Zip，系统自带解压对中文文件名可能乱码；
          3. 按解压出的《安装说明.md》安装（合并复制到 Rime 用户目录、重新部署）；
             整句模型只需装一次，见
             [Releases](https://github.com/${GITHUB_REPOSITORY}/releases) 的
             mohu-sentence-ngram-v5.bin（已装过魔虎可跳过）。

          逐字辅码与统计见同目录《构建报告.txt》《推导辅码表.tsv》。
          ⚠ 下载链接 **7 天后过期**，过期后开一个新 Issue 重跑即可。"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$REPLY"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
        env:
          RUN_ID: ${{ github.run_id }}

      - name: 构建失败时回复原因
        if: failure()
        run: |
          {
            echo "## ❌ 构建失败"
            echo
            echo '```'
            tail -n 30 issue-work/build.log 2>/dev/null || cat issue-work/parse.log 2>/dev/null || echo "（无日志，请到 Actions 页查看本次运行）"
            echo '```'
            echo
            echo "按上面的报错提示**编辑这个 Issue**（改码表附件或参数）后保存，会自动重新构建。"
          } > issue-work/fail.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file issue-work/fail.md
