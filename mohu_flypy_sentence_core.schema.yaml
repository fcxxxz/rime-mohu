# Compile-only dependency: builds the sentence dictionary and its prism.
# Not a selectable input scheme; interactive features live in mohu_flypy.schema.yaml.
schema:
  schema_id: mohu_flypy_sentence_core
  version: '20261008'
engine:
  translators:
  - script_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ/=;
  delimiter: ' '''
  algebra:
    __patch:
    - mohu:/algebra/user_force_top?
    - mohu:/algebra/user_sentence_top?
    - mohu:/algebra/fly_flypy?
    - mohu:/algebra/generate_code
    - mohu:/algebra/user_sentence_bottom?
    - mohu:/algebra/user_force_bottom?
translator:
  dictionary: mohu_flypy.words
  prism: mohu_flypy
  enable_user_dict: false
