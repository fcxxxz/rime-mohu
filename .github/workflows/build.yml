name: Build distribution

on:
  pull_request:
  push:
    branches: [main]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python environment
        run: uv sync --locked

      - name: Install MinGW toolchain and Python
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python

      - name: Build Lua 5.4.8 host and runtime
        shell: msys2 {0}
        env:
          LUA548_SHA256: 4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae
        run: |
          # Tiger Weasel embeds Lua 5.4.8. macOS Squirrel intentionally uses
          # its separate 5.4.6 dylib build; these runtimes cannot be mixed.
          curl -sL -o lua548.tar.gz https://www.lua.org/ftp/lua-5.4.8.tar.gz
          printf '%s  %s\n' "$LUA548_SHA256" lua548.tar.gz | sha256sum -c -
          tar xzf lua548.tar.gz
          cd lua-5.4.8/src
          core="lapi.c lcode.c lctype.c ldebug.c ldo.c ldump.c lfunc.c lgc.c llex.c lmem.c lobject.c lopcodes.c lparser.c lstate.c lstring.c ltable.c ltm.c lundump.c lvm.c lzio.c"
          lib="lauxlib.c lbaselib.c lcorolib.c ldblib.c liolib.c lmathlib.c loadlib.c loslib.c lstrlib.c ltablib.c lutf8lib.c linit.c"
          gcc -O2 -shared -DLUA_BUILD_AS_DLL $core $lib -o lua54.dll
          gcc -O2 -DLUA_BUILD_AS_DLL lua.c -o lua.exe lua54.dll

      - name: Fetch onnxruntime for Windows
        shell: msys2 {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tigerengine.cc 内建魔虎语义进程内推理（semantic_infer.h），
          # 编译与运行都需要 onnxruntime。官方 win-x64 zip：lib/ 内含
          # onnxruntime.lib 与 onnxruntime.dll，include/ 含 C++ API 头。
          # 2026-09-17 起 runner 上 curl 直连 github release 下载（含本仓
          # 资产与官方源）稳定 404，objects CDN 链路异常；改用 gh CLI 走
          # api.github.com 拉取本仓 ort-deps Release 的同内容转存，官方
          # 源 curl 仅作后备，统一以官方 sha256 校验。
          ORT_ZIP=onnxruntime-win-x64-1.20.1.zip
          ORT_SHA256=78d447051e48bd2e1e778bba378bec4ece11191c9e538cf7b2c4a4565e8f5581
          # msys2 shell 不继承 Windows PATH，gh 用绝对路径兜底。
          GH_BIN="$(command -v gh || echo '/c/Program Files/GitHub CLI/gh.exe')"
          if "$GH_BIN" release download ort-deps --pattern "${ORT_ZIP}" --output ort.zip --clobber \
            && [ -s ort.zip ]; then
            echo "fetched from repo mirror via gh api"
          elif curl --fail --location --retry 3 --retry-all-errors --output ort.zip \
            "https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/${ORT_ZIP}"; then
            echo "fetched from upstream mirror"
          else
            echo "all onnxruntime sources failed" >&2
            exit 1
          fi
          echo "${ORT_SHA256}  ort.zip" | sha256sum -c -
          python -m zipfile -e ort.zip .

      - name: Build and smoke-test the Windows engine
        shell: msys2 {0}
        env:
          ORT_HOME: ${{ github.workspace }}/onnxruntime-win-x64-1.20.1
          GH_TOKEN: ${{ github.token }}
        run: |
          g++ -O2 -std=c++17 -shared -static-libgcc -static-libstdc++ \
            -D_stdcall=__stdcall \
            -I tiger_sentence_native -I lua-5.4.8/src \
            -I "$ORT_HOME/include" -L "$ORT_HOME/lib" \
            tiger_sentence_native/tigerengine.cc tiger_sentence_native/tigerengine_lua.cc \
            lua-5.4.8/src/lua54.dll -lonnxruntime -o libtigerengine.dll
          objdump -p libtigerengine.dll | grep -q luaopen_tigerengine
          cp "$ORT_HOME/lib/onnxruntime.dll" ./
          # 模型资产自 603f65a 起以 zip 形式发布（裸 bin 直链已不存在）；
          # 与 ort 同理走 gh api 下载，解压后取裸 bin。
          GH_BIN="$(command -v gh || echo '/c/Program Files/GitHub CLI/gh.exe')"
          "$GH_BIN" release download latest \
            --pattern 'mohu-sentence-ngram-v5.bin.zip' \
            --output model.zip --clobber
          python -m zipfile -e model.zip .
          test -s mohu-sentence-ngram-v5.bin
          g++ -O2 -std=c++17 -D_stdcall=__stdcall \
            -I tiger_sentence_native -I "$ORT_HOME/include" \
            tiger_sentence_native/nativetest.cc tiger_sentence_native/tigerengine.cc \
            -L "$ORT_HOME/lib" -lonnxruntime -o nativetest.exe
          printf '1\tufqyhfmimh\n' > keys.txt
          ./nativetest.exe mohu-sentence-ngram-v5.bin \
            tiger_sentence_native/data/zrm/mohu_zrm.lexicon.txt keys.txt out.txt
          grep -q '迷茫' out.txt
          cp lua-5.4.8/src/lua54.dll ./
          cat > smoke.lua <<'LUA'
          local dll, model, lexicon = ...
          local engine = assert(package.loadlib(dll, "luaopen_tigerengine"))()
          local snapshot = "用户快照.bin"
          local expected = "new\0snapshot"
          assert(engine.atomic_write_snapshot_file(snapshot, "old"))
          assert(engine.atomic_write_snapshot_file(snapshot, expected))
          assert(engine.read_snapshot_file(snapshot) == expected)
          local missing, read_error = engine.read_snapshot_file("missing/snapshot.bin")
          assert(missing == nil and type(read_error) == "string")
          local wrote, write_error = engine.atomic_write_snapshot_file("missing/snapshot.bin", "x")
          assert(wrote == false and type(write_error) == "string")
          local handle = assert(engine.create(model, lexicon, 200, 1))
          local output = assert(engine.decode(handle, "ufqyhfmimh", false))
          assert(output:find("迷茫", 1, true), output)
          engine.free(handle)
          LUA
          ./lua-5.4.8/src/lua.exe smoke.lua "$PWD/libtigerengine.dll" \
            "$PWD/mohu-sentence-ngram-v5.bin" \
            "$PWD/tiger_sentence_native/data/zrm/mohu_zrm.lexicon.txt"

      - name: Probe primary model mapping on Windows
        shell: msys2 {0}
        env:
          TIGER_ENGINE_DLL: ${{ github.workspace }}/libtigerengine.dll
          TIGER_NGRAM: ${{ github.workspace }}/mohu-sentence-ngram-v5.bin
          TIGER_LEXICON: ${{ github.workspace }}/tiger_sentence_native/data/zrm/mohu_zrm.lexicon.txt
          ONNXRUNTIME_HOME: ${{ github.workspace }}/onnxruntime-win-x64-1.20.1
        run: |
          make tigerengine-snapshot-io tigerengine-mobile tigerengine-mapping
          cp "$ONNXRUNTIME_HOME/lib/onnxruntime.dll" .tmp/native-tests/
          make tigerengine-windows-memory \
            TIGER_MEMORY_OUTPUT=.tmp/native-tests/tigerengine-windows-mapping.json

      - name: Upload Windows mapping probe
        uses: actions/upload-artifact@v4
        with:
          name: tigerengine-windows-mapping-${{ github.run_number }}-${{ github.run_attempt }}
          path: .tmp/native-tests/tigerengine-windows-mapping.json
          if-no-files-found: error
          retention-days: 14

      - name: Collect Windows runtime closure
        shell: msys2 {0}
        run: >-
          python tools/collect_windows_runtime.py
          --entry libtigerengine.dll
          --search-dir .
          --search-dir lua-5.4.8/src
          --search-dir onnxruntime-win-x64-1.20.1/lib
          --search-dir /mingw64/bin
          --objdump objdump
          --output windows-runtime

      - name: Upload Windows runtime closure
        uses: actions/upload-artifact@v4
        with:
          name: mohu-windows-runtime-${{ github.run_number }}-${{ github.run_attempt }}
          path: windows-runtime/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: windows-runtime
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python environment
        run: uv sync --locked

      - name: Download Windows runtime closure
        uses: actions/download-artifact@v4
        with:
          name: mohu-windows-runtime-${{ github.run_number }}-${{ github.run_attempt }}
          path: windows-runtime

      - name: Install OpenCC
        run: brew install opencc onnxruntime
        # onnxruntime：build.sh 编译 libtigerengine（内建语义推理）需要其头文件

      - name: Build native engine
        run: make tigerengine-native

      - name: Build flat scheme packages
        run: |
          make dist-zrm dist-flypy ZRM_DESTDIR=dist-zrm FLYPY_DESTDIR=dist-flypy \
            TIGER_WINDOWS_RUNTIME=windows-runtime

      - name: Validate flat packages
        run: |
          test -f dist-zrm/default.yaml
          test -f dist-zrm/mohu_zrm.schema.yaml
          test -f dist-flypy/default.yaml
          test -f dist-flypy/mohu_flypy.schema.yaml
          test -f dist-zrm/mohu/runtime/libtigerengine.dylib
          test -f dist-flypy/mohu/runtime/libtigerengine.dylib
          test -f dist-zrm/mohu/runtime/libonnxruntime.1.dylib
          test -f dist-flypy/mohu/runtime/libonnxruntime.1.dylib
          test -f dist-zrm/mohu/runtime/libtigerengine.dll
          test -f dist-flypy/mohu/runtime/libtigerengine.dll
          test -f dist-zrm/mohu/runtime/runtime-preload.txt
          test -f dist-flypy/mohu/runtime/runtime-preload.txt
          test -f windows-runtime/runtime-manifest.json
          for dist in dist-zrm dist-flypy; do
            jq -r '.files[].name' windows-runtime/runtime-manifest.json | \
              while IFS= read -r runtime_file; do
                test -f "$dist/mohu/runtime/$runtime_file"
              done
          done
          test -f dist-zrm/mohu/data/zrm/mohu_zrm.lexicon.txt
          test -f dist-flypy/mohu/data/flypy/mohu_flypy.lexicon.txt
          test -f dist-zrm/Rime同步助手/安装.command
          test -f dist-flypy/Rime同步助手/安装.command
          test -x dist-zrm/解除隔离.command
          test -x dist-flypy/解除隔离.command
          test -f dist-zrm/mohu/model/README.md
          test -f dist-flypy/mohu/model/README.md
          test -f dist-zrm/mohu/config/README.md
          test -f dist-flypy/mohu/config/README.md
          test ! -e dist-zrm/base
          test ! -e dist-flypy/base
          test ! -e dist-zrm/mohu/model/mohu-sentence-ngram-v5.bin
          test ! -e dist-flypy/mohu/model/mohu-sentence-ngram-v5.bin

      - name: Build mobile lite packages
        run: make dist-mobile-zrm dist-mobile-flypy

      - name: Validate mobile lite packages
        run: |
          test -f dist-mobile-zrm/安装说明-手机版.md
          test -f dist-mobile-flypy/安装说明-手机版.md
          test -f dist-mobile-zrm/lua/mohu_tiger_sentence.lua
          test -f dist-mobile-zrm/mohu/data/zrm/mohu_zrm.lexicon.txt
          test -f dist-mobile-flypy/mohu/data/flypy/mohu_flypy.lexicon.txt
          test -f rime-mohu-mobile-zrm-lite.zip
          test -f rime-mohu-mobile-flypy-lite.zip
          for archive in rime-mohu-mobile-zrm-lite.zip rime-mohu-mobile-flypy-lite.zip; do
            unzip -t "$archive" >/dev/null
            # 精简包红线：不携带模型与任何 native 二进制。
            test -z "$(unzip -Z1 "$archive" | grep -E '\.(bin|onnx|dylib|dll|so)$' || true)"
          done

      - name: Upload mobile lite zrm package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-mobile-zrm-lite-${{ github.run_number }}-${{ github.run_attempt }}
          path: rime-mohu-mobile-zrm-lite.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload mobile lite flypy package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-mobile-flypy-lite-${{ github.run_number }}-${{ github.run_attempt }}
          path: rime-mohu-mobile-flypy-lite.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Natural Code distribution
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-zrm-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-zrm/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Flypy distribution
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rime-mohu-flypy-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-flypy/
          if-no-files-found: error
          retention-days: 14

      - name: Download V5 model asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 模型资产自 603f65a 起以 zip 形式发布，取 zip 解压出裸 bin。
          gh release download latest --repo "$GITHUB_REPOSITORY" \
            --pattern mohu-sentence-ngram-v5.bin.zip --dir model-asset
          unzip -o model-asset/mohu-sentence-ngram-v5.bin.zip -d model-asset -x "__MACOSX/*"
          test -s model-asset/mohu-sentence-ngram-v5.bin

      - name: Upload V5 model asset
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mohu-sentence-ngram-v5-${{ github.run_number }}-${{ github.run_attempt }}
          path: model-asset/mohu-sentence-ngram-v5.bin
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-release
      cancel-in-progress: false
    steps:
      - name: Download Natural Code distribution
        uses: actions/download-artifact@v4
        with:
          name: rime-mohu-zrm-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-zrm

      - name: Download Flypy distribution
        uses: actions/download-artifact@v4
        with:
          name: rime-mohu-flypy-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist-flypy

      - name: Download V5 model asset
        uses: actions/download-artifact@v4
        with:
          name: mohu-sentence-ngram-v5-${{ github.run_number }}-${{ github.run_attempt }}
          path: model-asset

      - name: Download mobile lite packages
        uses: actions/download-artifact@v4
        with:
          name: rime-mohu-mobile-zrm-lite-${{ github.run_number }}-${{ github.run_attempt }}
          path: mobile-lite

      - name: Download mobile lite flypy package
        uses: actions/download-artifact@v4
        with:
          name: rime-mohu-mobile-flypy-lite-${{ github.run_number }}-${{ github.run_attempt }}
          path: mobile-lite-flypy

      - name: Stage mobile lite packages
        run: |
          mv mobile-lite/rime-mohu-mobile-zrm-lite.zip .
          mv mobile-lite-flypy/rime-mohu-mobile-flypy-lite.zip .
          for archive in rime-mohu-mobile-zrm-lite.zip rime-mohu-mobile-flypy-lite.zip; do
            unzip -t "$archive" >/dev/null
            # 精简包红线：不携带模型与任何 native 二进制。
            test -z "$(unzip -Z1 "$archive" | grep -E '\.(bin|onnx|dylib|dll|so)$' || true)"
          done

      - name: Package flat distributions
        run: |
          # GitHub artifact transfer does not preserve executable bits.
          find dist-zrm dist-flypy -type f -name '*.command' -exec chmod +x {} +
          (cd dist-zrm && zip -qr ../rime-mohu-zrm-latest.zip .)
          (cd dist-flypy && zip -qr ../rime-mohu-flypy-latest.zip .)
          unzip -t rime-mohu-zrm-latest.zip >/dev/null
          unzip -t rime-mohu-flypy-latest.zip >/dev/null
          for pair in \
            "dist-zrm:rime-mohu-zrm-latest.zip" \
            "dist-flypy:rime-mohu-flypy-latest.zip"; do
            directory="${pair%%:*}"
            archive="${pair##*:}"
            unzip -Z1 "$archive" | grep -Fx "mohu/config/README.md" >/dev/null
            unzip -Z1 "$archive" | grep -Fx "mohu/runtime/runtime-preload.txt" >/dev/null
            jq -r '.files[].name' "$directory/mohu/runtime/runtime-manifest.json" | \
              while IFS= read -r runtime_file; do
                unzip -Z1 "$archive" | grep -Fx "mohu/runtime/$runtime_file" >/dev/null
              done
          done

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            '## 魔虎方案' \
            '' \
            '- 自然码：下载 `rime-mohu-zrm-latest.zip`，解压到 Rime 用户目录后重新部署。' \
            '- 小鹤：下载 `rime-mohu-flypy-latest.zip`，解压到 Rime 用户目录后重新部署。' \
            '- 模型：下载 `mohu-sentence-ngram-v5.bin`，放入 `Rime/mohu/model/`（运行时固定读取该文件名）。自 2026-09-16 起发布内容为 u8 量化格式 TCSKNM04（389.7MB，较原 f32 版 −32%，质量持平）；需配合本日期后构建的方案包，旧引擎会报 `unknown model format` 并退回普通候选。' \
            '- 手机精简版（Android Trime / iOS 仓输入法）：`rime-mohu-mobile-zrm-lite.zip` / `rime-mohu-mobile-flypy-lite.zip`，无模型无 native；想要整句自行导入模型并配合定制版前端，日常输入与用户词记忆开箱即用。' \
            '' \
            '桌面方案包不包含模型文件，适用于空的或专门准备的 Rime 用户目录。' \
            '' \
            '本次构建提交：'"${GITHUB_SHA::7}" > "$notes_file"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title 'Latest build' --notes-file "$notes_file" --latest
          else
            gh release create latest --target "$GITHUB_SHA" --title 'Latest build' --notes-file "$notes_file" --latest
          fi
          for asset in rime-mohu-latest.zip rime-mohu-llm-latest.zip rime-mohu-llm-runtime-latest.zip mohu-llm-zrm-latest.zip mohu-llm-flypy-latest.zip rime-mohu-qwen3-0.6b.zip rime-mohu-qwen35-0.8b.zip; do
            gh release delete-asset latest "$asset" --yes 2>/dev/null || true
          done
          gh release upload latest \
            rime-mohu-zrm-latest.zip \
            rime-mohu-flypy-latest.zip \
            rime-mohu-mobile-zrm-lite.zip \
            rime-mohu-mobile-flypy-lite.zip \
            model-asset/mohu-sentence-ngram-v5.bin \
            --clobber
          gh release edit latest --title 'Latest build' --notes-file "$notes_file" --latest
