name: semantic-models-release

# 在 runner 上下载模型并把分卷传到 release semantic-models-v1。
# 触发：手动（workflow_dispatch，选择 bf16 原版 / MLX 量化档）。
# 量化档实测（零泄漏 438 句）：8bit 三档零损失（+35/+41/+53）、
# 0.5B-4bit -1 分（+34）；3bit 已判死不发布。
on:
  workflow_dispatch:
    inputs:
      run_bf16:
        description: '发布 bf16 原版三档'
        type: boolean
        default: false
      run_quant:
        description: '发布 MLX 量化三档（0.5b-4bit/1.5b-8bit/3b-8bit）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: "0.5b",       repo: "Qwen/Qwen2.5-0.5B-Instruct",        kind: "bf16"}
          - {tag: "1.5b",       repo: "Qwen/Qwen2.5-1.5B-Instruct",        kind: "bf16"}
          - {tag: "3b",         repo: "Qwen/Qwen2.5-3B-Instruct",          kind: "bf16"}
          - {tag: "0.5b-4bit",  repo: "mlx-community/Qwen2.5-0.5B-Instruct-4bit", kind: "mlx"}
          - {tag: "1.5b-8bit",  repo: "mlx-community/Qwen2.5-1.5B-Instruct-8bit", kind: "mlx"}
          - {tag: "3b-8bit",    repo: "mlx-community/Qwen2.5-3B-Instruct-8bit",   kind: "mlx"}
    timeout-minutes: 90
    env:
      TAG: ${{ matrix.tag }}
      REPO: ${{ matrix.repo }}
      RUN_FLAG: ${{ (matrix.kind == 'bf16' && inputs.run_bf16) || (matrix.kind == 'mlx' && inputs.run_quant) }}
    steps:
      - name: Skip if not selected
        if: env.RUN_FLAG != 'true'
        run: echo "skipping ${TAG} (${REPO})"

      - name: Set up Python
        if: env.RUN_FLAG == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install downloaders
        if: env.RUN_FLAG == 'true'
        run: pip install -q huggingface_hub modelscope

      - name: Download model (HF first, ModelScope fallback)
        if: env.RUN_FLAG == 'true'
        run: |
          set -e
          python - <<'EOF'
          import os, shutil, glob
          repo = os.environ["REPO"]
          patterns = ["*.json", "*.txt", "*.jinja", "*.safetensors"]
          try:
              from huggingface_hub import snapshot_download
              p = snapshot_download(repo, allow_patterns=patterns)
              print(f"HF ok: {p}")
          except Exception as e:
              print(f"HF failed ({type(e).__name__}), fallback ModelScope: {e}")
              from modelscope import snapshot_download as ms_dl
              p = ms_dl(repo)
              print(f"ModelScope ok: {p}")
          snap = glob.glob(os.path.join(p, "snapshots", "*"))
          src = snap[0] if snap else p
          os.makedirs("/tmp/model", exist_ok=True)
          for f in os.listdir(src):
              shutil.copy2(os.path.join(src, f), "/tmp/model/" + f)
          print("files:", sorted(os.listdir("/tmp/model")))
          EOF

      - name: Split into volumes
        if: env.RUN_FLAG == 'true'
        run: |
          set -e
          mkdir -p /tmp/vol
          cd /tmp/model
          tar -cf - . | split -b 1900m - "/tmp/vol/mohu-semantic-qwen2.5-${TAG}.tar.part-"
          ls -la /tmp/vol/

      - name: Upload to release
        if: env.RUN_FLAG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          for f in /tmp/vol/*; do
            name=$(basename "$f")
            if gh release view semantic-models-v1 --json assets \
               -q '.assets[].name' | grep -qx "$name"; then
              gh release delete-asset semantic-models-v1 "$name" --yes
            fi
          done
          gh release upload semantic-models-v1 /tmp/vol/* --clobber
          echo "uploaded ${TAG}"
