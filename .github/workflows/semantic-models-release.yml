name: semantic-models-release

# 在 runner 上下载模型；小模型发布单 ZIP，超过资产上限才保留 tar 分卷。
# 触发：手动（workflow_dispatch，选择 bf16 原版 / MLX 量化档）。
# 量化档实测（零泄漏 438 句）：8bit 三档零损失（+35/+41/+53）、
# 0.5B-4bit -1 分（+34）；3bit 已判死不发布。
on:
  workflow_dispatch:
    inputs:
      run_bf16:
        description: '发布 bf16 原版三档'
        type: boolean
        default: false
      run_quant:
        description: '发布 MLX 量化三档（0.5b-4bit/1.5b-8bit/3b-8bit）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: "0.5b",       repo: "Qwen/Qwen2.5-0.5B-Instruct",        kind: "bf16"}
          - {tag: "1.5b",       repo: "Qwen/Qwen2.5-1.5B-Instruct",        kind: "bf16"}
          - {tag: "3b",         repo: "Qwen/Qwen2.5-3B-Instruct",          kind: "bf16"}
          - {tag: "0.5b-4bit",  repo: "mlx-community/Qwen2.5-0.5B-Instruct-4bit", kind: "mlx"}
          - {tag: "1.5b-8bit",  repo: "mlx-community/Qwen2.5-1.5B-Instruct-8bit", kind: "mlx"}
          - {tag: "3b-8bit",    repo: "mlx-community/Qwen2.5-3B-Instruct-8bit",   kind: "mlx"}
    timeout-minutes: 90
    env:
      TAG: ${{ matrix.tag }}
      REPO: ${{ matrix.repo }}
      RUN_FLAG: ${{ (matrix.kind == 'bf16' && inputs.run_bf16) || (matrix.kind == 'mlx' && inputs.run_quant) }}
    steps:
      - name: Check out packaging tools
        uses: actions/checkout@v4

      - name: Verify semantic model packaging
        run: python -m unittest tests.test_semantic_model_pack -v

      - name: Skip if not selected
        if: env.RUN_FLAG != 'true'
        run: echo "skipping ${TAG} (${REPO})"

      - name: Set up Python
        if: env.RUN_FLAG == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install downloaders
        if: env.RUN_FLAG == 'true'
        run: pip install -q huggingface_hub modelscope

      - name: Download model (HF first, ModelScope fallback)
        if: env.RUN_FLAG == 'true'
        run: |
          set -e
          python - <<'EOF'
          import os, shutil, glob, re
          repo = os.environ["REPO"]
          patterns = ["*.json", "*.txt", "*.jinja", "*.safetensors", "*.md", "LICENSE*", "NOTICE*"]
          try:
              from huggingface_hub import snapshot_download
              p = snapshot_download(repo, allow_patterns=patterns)
              print(f"HF ok: {p}")
          except Exception as e:
              print(f"HF failed ({type(e).__name__}), fallback ModelScope: {e}")
              from modelscope import snapshot_download as ms_dl
              p = ms_dl(repo)
              print(f"ModelScope ok: {p}")
          snap = glob.glob(os.path.join(p, "snapshots", "*"))
          src = snap[0] if snap else p
          os.makedirs("/tmp/model", exist_ok=True)
          for f in os.listdir(src):
              source = os.path.join(src, f)
              if os.path.isfile(source):
                  shutil.copy2(source, "/tmp/model/" + f)
          if not os.path.isfile("/tmp/model/LICENSE"):
              base = repo if repo.startswith("Qwen/") else "Qwen/" + re.sub(r"-[0-9]+bit$", "", repo.split("/", 1)[1])
              from huggingface_hub import hf_hub_download
              license_path = hf_hub_download(base, "LICENSE")
              shutil.copy2(license_path, "/tmp/model/LICENSE")
          print("files:", sorted(os.listdir("/tmp/model")))
          EOF

      - name: Package model for installation
        if: env.RUN_FLAG == 'true'
        run: |
          python tools/pack_semantic_model.py --model-dir /tmp/model \
            --output-dir /tmp/vol --tag "$TAG" --repo "$REPO"

      - name: Upload to release
        if: env.RUN_FLAG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          gh release upload semantic-models-v1 /tmp/vol/* --clobber
          # The default download page also carries the lightweight model.
          if [ "$TAG" = '0.5b-4bit' ]; then
            gh release upload latest /tmp/vol/*.zip /tmp/vol/*.sha256 --clobber
          fi
          echo "uploaded ${TAG}"
