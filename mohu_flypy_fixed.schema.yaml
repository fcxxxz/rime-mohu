schema:
  schema_id: mohu_flypy_fixed
  name: 字词·魔虎·小鹤
  version: "20260814"
  author:
    - 小鹤双拼方案：鹤氏
    - 方案制作：ksqsf
  description: |
    小鹤双拼配虎码最长主码前两码，采用 NAS 研究简码的码表式输入方式。
  dependencies:
    - mohu_flypy_fixed_legacy
    - mohu_charset
    - tiger

switches:
  - name: ascii_mode
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]
  - name: emoji
    states: [ 🈚, 🈶 ]
  - name: extended_charset
    states: [ 常用字, 全字集 ]
  - name: chaifen
    states: [ 不拆, 扌斥 ]
  - name: pinyinhint
    states: [ 🔇, 🔊 ]
  - name: unicode_comment
    states: [ U关, U开 ]
  - name: quick_code_hint
    states: [ 简码提示关, 简码提示 ]
  - name: aux_hint
    states: [ 辅助码提示关, 辅助码提示 ]
  - name: multi_short_code
    states: [ 多重简字, 唯一简字 ]
  - name: candidate_override_management
    states: [ 常规, 候选管理 ]
    reset: 0

engine:
  processors:
    - lua_processor@*mohu_skin_command
    - lua_processor@*mohu_candidate_manager*manager_processor
    - lua_processor@*mohu_candidate_override*override_processor
    - lua_processor@*mohu_pin*pin_processor
    - lua_processor@*option_sync
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - affix_segmentor@zkci
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@*mohu_symbol_hint
    - lua_translator@*mohu_candidate_manager*manager_translator
    - punct_translator
    - reverse_lookup_translator@reverse_tiger
    - reverse_lookup_translator@reverse_tiger_backtick
    - table_translator@custom_phrase       # 自定义短语
    - lua_translator@*mohu_contextual_translator*fixed_static_selector
    - lua_translator@*mohu_contextual_translator*fixed_selector
    - table_translator@zkci
    - history_translator@repeat
    - lua_translator@*mohu_shijian
    - lua_translator@*mohu_pin*panacea_translator
  filters:
    - lua_filter@*mohu_charset_filter
    - lua_filter@*mohu_pin*pin_filter
    - lua_filter@*mohu_candidate_override*override_order_filter
    - lua_filter@*mohu_candidate_override*override_filter
    - simplifier@emoji
    - simplifier@chaifen
    - simplifier@pinyinhint
    - lua_filter@*mohu_hint_filter
    - uniquifier

speller:
  alphabet: 'abcdefghijklmnopqrstuvwxyz/=;'
  delimiter: " '"
  max_code_length: 4
  auto_select: true
  auto_select_pattern: ^;(\w|;)+
  auto_clear: max_length # manual | auto | max_length
  algebra:
    __patch:
      - mohu:/algebra/user_force_top?
      - mohu:/algebra/user_force_bottom?

translator:
  dictionary: mohu_flypy_fixed
  db_class: tabledb
  enable_charset_filter: false
  enable_sentence: false
  enable_completion: false
  enable_user_dict: false
  initial_quality: 100000

fixed:
  dictionary: mohu_flypy_fixed
  user_dict: mohu_flypy_fixed_tiger_prefix2
  db_class: tabledb
  enable_charset_filter: false
  enable_sentence: false
  enable_completion: false
  enable_user_dict: true
  enable_encoder: true
  encode_commit_history: false   # 是否开启自动造词
  initial_quality: 1000

fixed_legacy:
  dictionary: mohu_flypy_fixed_legacy
  user_dict: mohu_flypy_fixed_tiger_prefix2
  db_class: tabledb
  enable_charset_filter: false
  enable_sentence: false
  enable_completion: false
  enable_user_dict: true
  enable_encoder: true
  encode_commit_history: false
  initial_quality: 1000

translator_legacy:
  dictionary: mohu_flypy_fixed_legacy
  db_class: tabledb
  enable_charset_filter: false
  enable_sentence: false
  enable_completion: false
  enable_user_dict: false
  initial_quality: 100000

custom_phrase: # 自定义短语
  dictionary: ""
  user_dict: mohu_flypy_custom_phrases
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 500000

zkci:           # 造词
  tag: zkci
  db_class: tabledb
  dictionary: mohu_flypy_fixed
  enable_user_dict: false
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: true
  enable_encoder: false
  max_phrase_length: 4
  prefix: "'"
  tips: 〔造词〕
  initial_quality: 10

repeat:        # 重复上屏
  input: "="
  size: 1
  initial_quality: 0

chaifen:
  option_name: chaifen
  opencc_config: mohu_chaifen.json
  tips: char
  show_in_comment: true
  comment_format:
    - "xform/-/ /"
    - "xform/〕〔/｜/"

recognizer:
  import_preset: default
  patterns:
    reverse_tiger: "^ohm[a-z]+$"
    reverse_tiger_backtick: "^`[a-z]+$"
    candidate_manager: "^==[hopwlu]?[a-z]*$"

    zkci: "^[a-z]*'[a-z']*$"
    panacea: "^[a-z]*/{1,2}[a-z']*$"
    punct: '^/([0-9]0?|[A-Za-z]*)$'


reverse_tiger:
  tag: reverse_tiger
  dictionary: tiger
  enable_completion: true
  prefix: "ohm"
  tips: 〔虎〕
  comment_format:
    - xform/(\w\w);(\w\w)/$1[$2]/

reverse_tiger_backtick:
  tag: reverse_tiger_backtick
  dictionary: tiger
  enable_completion: true
  prefix: "`"
  tips: 〔虎〕
  comment_format:
    - xform/(\w\w);(\w\w)/$1[$2]/

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default
  custom_bindings:
    __append:
      # 在这里添加只在本方案中生效的按键绑定
      # 取消下行注释，按住 = 不放可以连续上屏
      # - { when: has_menu, accept: '=', send: 4 }  # 4 对应于 history_translator 的输出位置，修改 symbols.yaml 后需要作相应修改
  bindings:
    __patch:
      - :/key_binder/custom_bindings?
      - mohu:/key_bindings/mohu_switches
      - mohu:/key_bindings/mohu_semicolon_for_2
      - mohu:/key_bindings/mohu_keypad

# 默认不开启语言模型（八股文模型已移除）

mohu:
  charset: simp
  candidate_manager:
    __include: mohu:/candidate_manager
    memory_namespace: fixed

  # 内置候选调序、软删除与恢复。
  candidate_override:
    __include: mohu:/candidate_override

  # 简快码提示滤镜，由方案菜单中的「简码提示」开关控制
  # 例如，在输入 jqrf 时，「机器人」候选会增加「⚡jqr」提示，表示该词有简码打法。
  quick_code_hint_skip_chars: true  # 是否跳过单字, 字词模式中建议不提示单字避免干扰
  inject_fixed_words: true          # 三字以上词允许提示四码简码

  pin:
    __include: mohu:/pin
