schema: mohu_flypy
source_dir: ../dist
script: |
  function eq(left, right)
    print('Left  = ' .. tostring(left))
    print('Right = ' .. tostring(right))
    return left == right
  end

  function has_text(candidates, text)
    for _, candidate in ipairs(candidates) do
      if candidate.text == text then return true end
    end
    return false
  end

  function text_index(candidates, text)
    for index, candidate in ipairs(candidates) do
      if candidate.text == text then return index end
    end
    return nil
  end

deploy:
  curated_short_codes_multi:
    patch:
      switches/@4/reset: 1
    tests:
      - send: tz
        assert: cand[1].text == '头' and cand[2].text == '投资' and cand[2].comment == '⚡️'
      - send: hd
        assert: cand[1].text == '还' and cand[2].text == '很多' and cand[2].comment == '⚡️' and cand[3].text == '回答' and cand[3].comment == '⚡️'
      - send: gs
        assert: cand[1].text == '共' and cand[2].text == '公司' and cand[2].comment == '⚡️'
      - send: zh
        assert: cand[1].text == '脏' and cand[2].text == '最后' and cand[2].comment == '⚡️'
      - send: tg
        assert: cand[1].text == '疼' and cand[2].text == '通过' and cand[2].comment == '⚡️'
      - send: dj
        assert: cand[1].text == '但' and cand[2].text == '大家' and cand[2].comment == '⚡️'
      - send: ku
        assert: cand[1].text == '哭' and cand[2].text == '开始' and cand[2].comment == '⚡️'
      - send: gz
